# async depth config: promoted winner of the max_depth sweep (run 0306,
# tail depth 11.0, durable AC best-in-cohort). Rewards are descent-dominated
# with a per-floor bonus; SEARCH20 and RUN are masked.
# To use: copy to config/depth.ini, then ./puffer train depth
[base]
env_name = nethack
reset_every_horizon = 0
async = 1

[vec]
total_agents = 512
num_buffers = 4
num_threads = 32
action_mask_size = 734

[env]
gold_coef = 0.00100000005
exp_coef = 0.00999999978
descent_coef = 1.0
# pays once per new unique (dnum, dlevel) floor entered (branches count)
floor_coef = 0.727649987
xp_coef = 0.33030045
scout_coef = 0.0165148061
ac_coef = 0.0
death_penalty = -0.0327779055

# flags
# scout reward scales with xp level relative to depth; <= 0 disables
scout_ready = 0.0
# fraction of protection-spell AC excluded from the ac reward; 1 = armor only
ac_nospell = 1.0
# 1 removes the verb from the action space
mask_search20 = 1
mask_run = 1
# 1 = random role/race/gender/align per reset (challenge protocol)
multi_role = 0

[policy]
hidden_size = 512
num_layers = 3

[train]
total_timesteps = 366129632
minibatch_size = 8192
horizon = 512
learning_rate = 0.00112607062
momentum = 0.98707521
verb_eps = 0.005
verb_eps_anneal_start = 0.4
verb_eps_anneal_end = 1.0
gamma = 0.9966259
gae_lambda = 0.83733207
replay_ratio = 1.82700419
clip_coef = 0.245328903
vf_coef = 3.35665774
vf_clip_coef = 2.18958735
max_grad_norm = 1.28095329
ent_coef = 0.00987035036
anneal_lr = 1
anneal_ent_coef = 0
min_lr_ratio = 0.0
min_ent_coef_ratio = 0.1
beta1 = 0.9694917707305044
beta2 = 0.9475724955192064
eps = 0.0001
vtrace_rho_clip = 1.0
vtrace_c_clip = 1.0
prio_alpha = 0.259415656
prio_beta0 = 0.19331935

[sweep]
metric = max_depth

[sweep.train.total_timesteps]
distribution = log_normal
min = 2e8
max = 1e9
scale = time

[sweep.env.exp_coef]
distribution = log_normal
min = 0.01
max = 1.0
scale = auto

[sweep.env.gold_coef]
distribution = log_normal
min = 0.001
max = 1.0
scale = auto

[sweep.env.descent_coef]
distribution = uniform
min = 0.0
max = 1.0
scale = auto

[sweep.env.floor_coef]
distribution = uniform
min = 0.0
max = 1.0
scale = auto

[sweep.env.xp_coef]
distribution = uniform
min = 0.0
max = 1.0
scale = auto

[sweep.env.scout_coef]
distribution = log_normal
min = 0.001
max = 1.0
scale = auto

[sweep.env.death_penalty]
distribution = uniform
min = -1.0
max = 0.0
scale = auto
