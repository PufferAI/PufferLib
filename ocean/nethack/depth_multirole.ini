# depth.ini (sweep 0306, tail depth 11.0, async, RNN carry) with challenge
# multi-role. ~366M steps; Fin's single-role 400M depth runs were 33-43 min.
# Use: copy over config/nethack.ini then ./build.sh nethack && ./puffer train
[base]
env_name = nethack
reset_every_horizon = 0
async = 1

[vec]
total_agents = 512
num_buffers = 4
num_threads = 32
action_mask_size = 734

[env]
gold_coef = 0.00100000005
exp_coef = 0.00999999978
descent_coef = 1.0
floor_coef = 0.727649987
xp_coef = 0.33030045
scout_coef = 0.0165148061
ac_coef = 0.0
death_penalty = -0.0327779055
scout_ready = 0.0
ac_nospell = 1.0
mask_search20 = 1
mask_run = 1
multi_role = 1

[policy]
