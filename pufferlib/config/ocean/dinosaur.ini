[base]
package = ocean
env_name = puffer_dinosaur
policy_name = Policy
rnn_name = Recurrent

[env]
num_envs = 1024
width = 800
height = 400
speed_init = 6
speed_max = 12
spawn_rate_max = 100
spawn_rate_min = 50
rate_increment_rate = 400
max_obstacles = 10

[train]
total_timesteps = 120_000_000
adam_beta1: 0.95
adam_beta2: 0.999
adam_eps: 0.0001
batch_size: auto
bptt_horizon: 64
clip_coef: 0.2
ent_coef: 0.001
gae_lambda: 0.9
gamma: 0.99
learning_rate: 0.01
max_grad_norm: 1.5
minibatch_size: 8192
prio_alpha: 0.8
prio_beta0: 0.2
vf_clip_coef: 0.2
vf_coef: 2
vtrace_c_clip: 1
vtrace_rho_clip: 1
