[base]
package = ocean
env_name = puffer_ants
policy_name = Policy
rnn_name = Recurrent

[env]
num_envs = 1

[train]
total_timesteps = 100_000_000
gamma = 0.99
learning_rate = 0.0003
batch_size = 131072
minibatch_size = 4096
update_epochs = 1
checkpoint_interval = 50
clip_coef = 0.2
vf_coef = 0.5
ent_coef = 0.01
max_grad_norm = 0.5
target_kl = 0.015
gae_lambda = 0.95
bptt_horizon = 8