[base]
package = ocean
env_name = puffer_robotarm_pickplace
policy_name = Policy
rnn_name = Recurrent

[env]
num_envs = 512
max_steps = 1000
render_mode = None
pick_and_place_mode = true
reach_only = false

frame_skip = 1
success_distance = 0.08
obs_noise_std = 0.0
actuation_noise_std = 0.0
action_smoothing_alpha = 0.20
accel_limit = 10.0
damping = 0.1
domain_randomization = 0
action_penalty_coef = 0.0
reward_scale = 1.0
assist_enabled = 1
assist_episodes = 3000
start_grasp_prob = 0.6

[train]
total_timesteps = 2_000_000
gamma = 0.99
learning_rate = 0.001
minibatch_size = 4096
batch_size = auto
update_epochs = 4
horizon = 768

clip_coef = 0.2
ent_coef = 0.0003
vf_coef = 0.5
max_grad_norm = 0.5
gae_lambda = 0.95

device = cuda
compile = False
anneal_lr = False