[base]
package = ocean
env_name = puffer_robotarm_pickplace
policy_name = Policy
rnn_name = Recurrent

[env]
num_envs = 512
max_steps = 1000
render_mode = None
pick_and_place_mode = true
reach_only = false

# Physics parameters for rigid body simulation
frame_skip = 2
success_distance = 0.08
obs_noise_std = 0.005
actuation_noise_std = 0.005
action_smoothing_alpha = 0.25
accel_limit = 10.0
damping = 0.1
# Encourage lower-variance actions and increase reward signal strength
action_penalty_coef = 0.003
reward_scale = 10.0

[train]
total_timesteps = 2_000_000
gamma = 0.995
learning_rate = 0.0003
minibatch_size = 4096
batch_size = auto
update_epochs = 4
horizon = 512

# PPO parameters optimized for manipulation
clip_coef = 0.2
ent_coef = 0.01
vf_coef = 0.5
max_grad_norm = 0.5
gae_lambda = 0.95

# GPU acceleration settings
device = cuda
compile = False