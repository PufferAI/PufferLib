[base]
package = ocean
env_name = puffer_mazing_contest
policy_name = Policy
rnn_name = Recurrent

[vec]
num_envs = 8

[env]
num_envs = 1024

[policy]
hidden_size = 32

[rnn]
input_size = 32
hidden_size = 32

[train]
total_timesteps = 400_000_000
vf_coef= 2
adam_eps= 1e-8
ent_coef= 0.01000000000000001
anneal_lr= true
clip_coef= 0.2
optimizer= muon
precision= float32
adam_beta1= 0.9
adam_beta2= 0.999
batch_size= auto
gae_lambda= 0.95
prio_alpha= 0.8499999999999999
prio_beta0= 0.8499999999999999
bptt_horizon= 64
entropy_coef= 0.1
vf_clip_coef= 0.20000000000000012
learning_rate= 0.01000000000000001
compile_mode= max-autotune-no-cudagraphs
max_grad_norm= 1
update_epochs= 4
vtrace_c_clip= 1
minibatch_size= 131072 
vtrace_rho_clip= 1
compile_fullgraph= true
max_minibatch_size= 131072 
checkpoint_interval= 200
torch_deterministic= True
gamma=.98