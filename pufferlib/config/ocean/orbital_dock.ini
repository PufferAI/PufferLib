[base]
package = ocean
env_name = puffer_orbital_dock
policy_name = Policy
rnn_name = Recurrent

[policy]
hidden_size = 128

[rnn]
input_size = 128
hidden_size = 128

[vec]
num_envs = 4

[env]
num_envs = 1024
mu = 3.986e14
station_radius = 6.771e6
dt = 1.0
max_thrust = 50.0
mass = 10000.0
fuel_budget = 50.0
max_steps = 500
dock_dist = 50.0
dock_speed = 0.5
difficulty = 0.0
reward_dock = 100.0
reward_dist_shaping = 0.5
reward_closing = 0.1
reward_vel_match = 1.0
reward_fuel_penalty = 0.5
reward_crash = 10.0
reward_deorbit = 5.0
reward_escape = 5.0
reward_plane_align = 0.005
reward_node_timing = 0.002

[train]
device = mps
learning_rate = 3e-4
batch_size = auto
minibatch_size = 4096
update_epochs = 4
gamma = 0.99
gae_lambda = 0.95
clip_coef = 0.2
ent_coef = 0.01
vf_coef = 0.5
max_grad_norm = 0.5
total_timesteps = 100_000_000
checkpoint_interval = 200
bptt_horizon = 64
use_rnn = false

[sweep]
downsample = 0

[sweep.train.total_timesteps]
distribution = log_normal
min = 5e7
max = 2e8
mean = 1e8
scale = time
