[base]
package = ocean
env_name = puffer_orbital_dock
policy_name = OrbitalDock
rnn_name = Recurrent

[policy]
hidden_size = 256

[rnn]
input_size = 256
hidden_size = 256

[vec]
num_envs = 4

[env]
# 1024 envs for PufferLib throughput (STELLAR used 30)
num_envs = 1024
render_mode = "None"
mu = 3.986e14
# GEO orbit: R = 42,164 km
station_radius = 42164000.0
dt = 1.0
max_thrust = 10.0
mass = 500.0
fuel_budget = 100.0
max_steps = 2500
# Docking point (STELLAR: [0, 60, 0] in LVLH)
dock_x = 0.0
dock_y = 60.0
dock_z = 0.0
# Docking thresholds (STELLAR: 10m, 2 m/s)
dock_dist = 10.0
dock_speed = 2.0
# Speed annealing: dock_speed_start -> dock_speed over anneal_steps per-env steps
# Set anneal_steps = 0 to disable annealing (use dock_speed directly)
# Set dock_speed = 999.0 to revert to Exp 8 (no speed requirement)
dock_speed_start = 10.0
anneal_steps = 350000
# LOS cone (STELLAR: 60 deg total, 800m extent)
los_angle = 60.0
los_extent = 800.0
# Initial conditions (STELLAR V-bar approach)
init_x_center = 0.0
init_y_center = 800.0
init_z_center = 0.0
init_x_range = 400.0
init_y_range = 300.0
init_z_range = 400.0

[train]
device = mps
learning_rate = 0.001
# 4096 total agents × 16 bptt = 65536
batch_size = 65536
minibatch_size = 4096
update_epochs = 2
gamma = 0.998
gae_lambda = 0.98
clip_coef = 0.06
ent_coef = 0.005
vf_coef = 0.5
vf_clip_coef = 0.5
max_grad_norm = 0.5
anneal_lr = true
min_lr_ratio = 0.1
total_timesteps = 500_000_000
checkpoint_interval = 200
# MLP, no LSTM (STELLAR uses MLP)
bptt_horizon = 16
use_rnn = false

[sweep]
downsample = 0

[sweep.train.total_timesteps]
distribution = log_normal
min = 5e7
max = 2e8
mean = 1e8
scale = time
