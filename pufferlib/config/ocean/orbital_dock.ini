[base]
package = ocean
env_name = puffer_orbital_dock
policy_name = Policy
rnn_name = Recurrent

[policy]
hidden_size = 128

[rnn]
input_size = 128
hidden_size = 128

[vec]
num_envs = 4

[env]
num_envs = 1024
render_mode = "None"
mu = 3.986e14
station_radius = 6.771e6
dt = 1.0
max_thrust = 5000.0
mass = 10000.0
fuel_budget = 100.0
max_steps = 200
# Hierarchical velocity control (Hovell & Ulrich 2021)
kp = 0.5
max_cmd_vel = 2.0
# Docking conditions
dock_dist = 5.0
dock_speed = 0.5
difficulty = 0.0
# Reward weights - scaled to fit within PufferLib's [-1, 1] reward clamp
# Per-step shaping: ~0.01-0.1, terminal rewards: ~1.0
reward_dock = 1.0
reward_dist_shaping = 0.1
reward_closing = 0.5
reward_vel_match = 0.0
reward_fuel_penalty = 0.0
reward_crash = 1.0
reward_deorbit = 1.0
reward_escape = 1.0
reward_plane_align = 0.0
reward_node_timing = 0.0

[train]
device = mps
learning_rate = 0.01
batch_size = auto
minibatch_size = 4096
update_epochs = 1
gamma = 0.9975
gae_lambda = 0.96
clip_coef = 0.06
ent_coef = 0.002
vf_coef = 2.0
vf_clip_coef = 0.5
max_grad_norm = 1.5
total_timesteps = 200_000_000
checkpoint_interval = 200
bptt_horizon = 64
use_rnn = true

[sweep]
downsample = 0

[sweep.train.total_timesteps]
distribution = log_normal
min = 5e7
max = 2e8
mean = 1e8
scale = time
