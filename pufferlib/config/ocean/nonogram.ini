[base]
package = ocean
env_name = puffer_nonogram
policy_name = Nonogram
rnn_name = Recurrent

[env]
num_envs = 4096
min_size = 4
max_size = 8
easy_learn = 0

[sweep]
metric = score

[train]
name = pufferai
seed = 42
gamma = 0.99965
device = cuda
compile = False
project = ablations
use_rnn = True
vf_coef = 2.365
adam_eps = 1.566e-10
data_dir = experiments
ent_coef = 0.01554
anneal_lr = True
clip_coef = 0.1267
optimizer = muon
precision = float32
adam_beta1 = 0.7912
adam_beta2 = 0.999949
batch_size = auto
gae_lambda = 0.9007
prio_alpha = 0.7441
prio_beta0 = 0.7365
cpu_offload = False
bptt_horizon = 64
compile_mode = max-autotune-no-cudagraphs
vf_clip_coef = 1.598
learning_rate = 0.007103
max_grad_norm = 1.275
update_epochs = 1
vtrace_c_clip = 0.8692
minibatch_size = 32768
total_timesteps = 2e10
vtrace_rho_clip = 0.9074
compile_fullgraph = True
max_minibatch_size = 32768
checkpoint_interval = 200
torch_deterministic = True
