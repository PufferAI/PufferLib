# Config for OSRS Inferno encounter.
# 8 action heads (79 logits), 1058 obs, long episodes (300-8000+ ticks).
# Base anchor is the best local Zuk sweep run so far:
# logs/osrs_inferno/1776841634625.json (zuk_hp_remaining ~= 379.54).

[base]
env_name = osrs_inferno
policy_name = MinGRU
rnn_name = Recurrent
score_metric = episode_return

[env]
start_wave = 69
damage_reward_coeff = 0.01
shield_penalty_coeff = 0.01
tag_reward_coeff = 0.25
late_start_supply_profile_scale = 1.0
mask_in_obs = 1.0
record_best_replay_path = ""
play_replay_path = ""
# curriculum: fraction of agents starting at later waves (rest at start_wave)
curriculum_wave_1 = 20.0
curriculum_frac_1 = 0.0
curriculum_wave_2 = 40.0
curriculum_frac_2 = 0.0
curriculum_wave_3 = 60.0
curriculum_frac_3 = 0.0

[vec]
total_agents = 256
num_buffers = 2
num_threads = 16

[policy]
hidden_size = 256
num_layers = 3

[train]
total_timesteps = 67_907_217
horizon = 64
min_lr_ratio = 0.5544664329830781
learning_rate = 0.007342913951242895
beta1 = 0.9077345426199611
beta2 = 0.9998701883037843
eps = 0.000011107053106255366
ent_coef = 0.035000561348824843
gamma = 0.9999778934320869
gae_lambda = 0.900343737151439
vtrace_rho_clip = 1.7475641754896718
vtrace_c_clip = 1.3981828660058588
prio_alpha = 0.0
prio_beta0 = 0.441357822328451
clip_coef = 0.08710137806213623
vf_coef = 0.18246784374201588
vf_clip_coef = 0.23959086025245466
max_grad_norm = 2.015204763920358
replay_ratio = 1.2124850932570845
minibatch_size = 4096

[sweep]
min_sps = 100000
max_suggestion_cost = 720
max_runs = 0
gpus = 1
metric = episode_return
metric_distribution = linear
sweep_only = total_timesteps, horizon, learning_rate, ent_coef, gamma, min_lr_ratio, beta1, eps, gae_lambda, vtrace_rho_clip, vtrace_c_clip, prio_alpha, prio_beta0, clip_coef, vf_coef, vf_clip_coef, max_grad_norm, replay_ratio, total_agents, num_layers

[sweep.train.total_timesteps]
distribution = log_normal
min = 50000000
max = 150000000
scale = time

[sweep.train.horizon]
distribution = uniform_pow2
min = 32
max = 256
scale = auto

[sweep.train.learning_rate]
distribution = log_normal
min = 0.0003
max = 0.01
scale = 0.5

[sweep.train.ent_coef]
distribution = log_normal
min = 0.001
max = 0.1
scale = auto

[sweep.train.gamma]
distribution = logit_normal
min = 0.99
max = 0.999999
scale = auto

[sweep.train.min_lr_ratio]
distribution = uniform
min = 0.0
max = 0.75
scale = auto

[sweep.train.beta1]
distribution = uniform
min = 0.8
max = 0.99
scale = auto

[sweep.train.eps]
distribution = log_normal
min = 1e-6
max = 1e-4
scale = auto

[sweep.train.gae_lambda]
distribution = logit_normal
min = 0.5
max = 0.999
scale = auto

[sweep.train.vtrace_rho_clip]
distribution = uniform
min = 1.0
max = 3.0
scale = auto

[sweep.train.vtrace_c_clip]
distribution = uniform
min = 1.0
max = 1.6
scale = auto

[sweep.train.prio_alpha]
distribution = logit_normal
min = 0.0
max = 0.2
scale = auto

[sweep.train.prio_beta0]
distribution = logit_normal
min = 0.01
max = 0.8
scale = auto

[sweep.train.clip_coef]
distribution = uniform
min = 0.02
max = 0.5
scale = auto

[sweep.train.vf_coef]
distribution = log_normal
min = 0.1
max = 0.75
scale = auto

[sweep.train.vf_clip_coef]
distribution = uniform
min = 0.1
max = 2.0
scale = auto

[sweep.train.max_grad_norm]
distribution = uniform
min = 0.5
max = 3.0
scale = auto

[sweep.train.replay_ratio]
distribution = uniform
min = 0.1
max = 2.0
scale = auto

[sweep.vec.total_agents]
distribution = uniform_pow2
min = 128
max = 512
scale = auto

[sweep.policy.num_layers]
distribution = int_uniform
min = 2
max = 3
scale = auto
