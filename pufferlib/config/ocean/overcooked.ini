[base]
package = ocean
env_name = puffer_overcooked
policy_name = Policy
rnn_name = Recurrent

[env]
num_envs = 1024
num_agents = 1

[train]
total_timesteps = 10_000_000_000
learning_rate = 0.10
minibatch_size = 32768
gamma = 0.99
ent_coef = 0.15
gae_lambda = 0.97
clip_coef = 0.35
anneal_lr = False

[sweep]
method = Protein
metric = score
goal = maximize
downsample = 10

[sweep.train.gamma]
distribution = logit_normal
min = 0.9
mean = 0.99
max = 0.999
scale = auto

[sweep.train.ent_coef]
distribution = log_normal
min = 0.001
mean = 0.02
max = 0.1
scale = auto