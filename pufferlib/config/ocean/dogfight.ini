[sweep.env.penalty_neg_g]
distribution = uniform
max = 0.005
mean = 0.002
min = 0.0
scale = auto

[sweep.env.penalty_rudder]
distribution = uniform
max = 0.001
mean = 0.0002
min = 0.0
scale = auto

[sweep.env.reward_closing_scale]
distribution = uniform
max = 0.005
