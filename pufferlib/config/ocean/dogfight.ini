[base]
package = ocean
env_name = puffer_dogfight
policy_name = Policy

[vec]
num_envs = 8

[env]
num_envs = 128
max_steps = 3000
obs_scheme = 0

[train]
total_timesteps = 100_000_000
learning_rate = 0.0003
batch_size = 65536
minibatch_size = 16384#32768
update_epochs = 4
gamma = 0.99
gae_lambda = 0.95
clip_coef = 0.2
vf_coef = 0.5
max_grad_norm = 0.5

[sweep.env.obs_scheme]
distribution = int_uniform
min = 0
max = 5
mean = 2
scale = 1.0
