[base]
env_name = puffer_dogfight
package = ocean
policy_name = Policy
rnn_name = Recurrent

[vec]
num_envs = 8

[env]
alt_max = 2500.0
curriculum_enabled = 1
curriculum_randomize = 0
episodes_per_stage = 6
max_steps = 3000
num_envs = 1024
obs_scheme = 0
penalty_aileron = 0.0028
penalty_bias = 0.0045
penalty_neg_g = 0.03165409598499537
penalty_roll = 0.0011118892058730127
penalty_rudder = 0.0009555361184291542
penalty_stall = 0.0018532105861231685
reward_approach = 0.011704089175909758
reward_closing_scale = 0.0026911393087357283
reward_firing_solution = 0.03397578671574593
reward_level = 0.023
reward_tail_scale = 0.008432955490425229
reward_tracking = 0.025885825138539077
speed_min = 50.0
aim_cone_start = 0.21244025824591517
aim_cone_end = 0.14784255508333444
aim_anneal_episodes = 20

[train]
# df5 perf~1.0 hyperparameters
adam_beta1 = 0.9768629406862324
adam_beta2 = 0.999302214750495
adam_eps = 6.906760212075045e-12
batch_size = auto
bptt_horizon = 64
checkpoint_interval = 200
clip_coef = 0.4928184678032994
ent_coef = 0.008
gae_lambda = 0.8325103714810463
gamma = 0.8767105842751813
learning_rate = 0.00024
max_grad_norm = 0.831714766100049
max_minibatch_size = 65536#32768
minibatch_size = 65536
prio_alpha = 0.8195880336315146
prio_beta0 = 0.9429570720846501
seed = 42
total_timesteps = 400_000_000
update_epochs = 4
vf_clip_coef = 3.2638480501249436
vf_coef = 4.293249868787825
vtrace_c_clip = 1.911078435368836
vtrace_rho_clip = 3.797866655513644

[sweep]
downsample = 1
goal = maximize
method = Protein
metric = ultimate
prune_pareto = True
use_gpu = True

[sweep.env.obs_scheme]
distribution = int_uniform
max = 5
mean = 0
min = 0
scale = 1.0

[sweep.env.episodes_per_stage]
distribution = int_uniform
min = 1
max = 8
mean = 6
scale = 1.0

[sweep.env.penalty_stall]
distribution = uniform
max = 0.005
mean = 0.0016092406492793122
min = 0.0
scale = auto

[sweep.env.penalty_roll]
distribution = uniform
max = 0.003
mean = 0.0021072644960864573
min = 0.0
scale = auto

[sweep.env.penalty_neg_g]
distribution = uniform
max = 0.05
mean = 0.03
min = 0.01
scale = auto

[sweep.env.penalty_rudder]
distribution = uniform
max = 0.001
mean = 0.0002985792260932028
min = 0.0001
scale = auto

[sweep.env.penalty_aileron]
distribution = uniform
max = 0.005
mean = 0.0028
min = 0.0
scale = auto

[sweep.env.penalty_bias]
distribution = uniform
max = 0.02
mean = 0.0045
min = 0.001
scale = auto

[sweep.env.reward_approach]
distribution = uniform
max = 0.02
mean = 0.003836667464147351
min = 0.0
scale = auto

[sweep.env.reward_level]
distribution = uniform
max = 0.04
mean = 0.025
min = 0.01
scale = auto

[sweep.env.reward_closing_scale]
distribution = uniform
max = 0.005
mean = 0.005
min = 0.0
scale = auto

[sweep.env.reward_firing_solution]
distribution = uniform
max = 0.1
mean = 0.01
min = 0.0
scale = auto

[sweep.env.reward_tail_scale]
distribution = uniform
max = 0.01
mean = 0.005
min = 0.0
scale = auto

[sweep.env.reward_tracking]
distribution = uniform
max = 0.05
mean = 0.005177132307187232
min = 0.0
scale = auto

[sweep.env.aim_cone_start]
distribution = uniform
max = 0.52
mean = 0.35
min = 0.17
scale = auto

[sweep.env.aim_cone_end]
distribution = uniform
max = 0.17
mean = 0.087
min = 0.05
scale = auto

[sweep.env.aim_anneal_episodes]
distribution = int_uniform
max = 30
mean = 15
min = 5
scale = 1.0

[sweep.train.learning_rate]
distribution = log_normal
max = 0.0005
mean = 0.00025
min = 0.0001
scale = 0.5

[sweep.train.total_timesteps]
distribution = log_normal
max = 1.01e8
mean = 1.005e8
min = 1.0e8
scale = time

[sweep.train.vf_coef]
distribution = uniform
min = 1.0
max = 5.0
mean = 3.0
scale = auto

[sweep.train.clip_coef]
distribution = uniform
min = 0.3
max = 1.0
mean = 0.5
scale = auto

[sweep.train.ent_coef]
distribution = log_normal
min = 0.002
max = 0.02
mean = 0.008
scale = 0.5

# Override dangerous default.ini ranges that caused firm-gorge-40 crash
# default.ini allows min=0 which caused max_grad_norm=0.21 -> NaN explosion
[sweep.train.max_grad_norm]
distribution = uniform
min = 0.5
max = 2.0
mean = 1.0
scale = auto

# default.ini allows min=0.6 which caused gae_lambda=0.89 -> high variance
[sweep.train.gae_lambda]
distribution = logit_normal
min = 0.9
max = 0.999
mean = 0.95
scale = auto
