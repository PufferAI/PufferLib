[base]
env_name = puffer_dogfight
package = ocean
policy_name = Policy
rnn_name = Recurrent

[vec]
num_envs = 8

[env]
reward_aim_scale = 0.008445
reward_closing_scale = 0.0006818
penalty_neg_g = 0.01718
speed_min = 50.0

max_steps = 1112
num_envs = 1024
obs_scheme = 8

curriculum_enabled = 1
