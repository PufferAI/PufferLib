[base]
env_name = puffer_dogfight
package = ocean
policy_name = Policy

[vec]
num_envs = 8

[env]
alt_max = 2500.0
alt_min = 200.0
curriculum_enabled = 1
curriculum_randomize = 0
episodes_per_stage = 15000
max_steps = 3000
num_envs = 128
obs_scheme = 5
penalty_alt_high = 0.0005827077768771863
penalty_alt_low = 0.002
penalty_stall = 0.0002721180505886892
penalty_roll = 0.001
penalty_neg_g = 0.002
penalty_rudder = 0.0002
reward_closing_scale = 0.0017502788052182153
reward_dist_scale = 0.0005
reward_firing_solution = 0.036800363039378
reward_tail_scale = 0.0001
reward_tracking = 0.09535446288907798
speed_min = 50.0

[train]
adam_beta1 = 0.9558396408962972
adam_beta2 = 0.9999437812872052
adam_eps = 1.9577097149594289e-07
batch_size = 65536
bptt_horizon = 32
checkpoint_interval = 200
clip_coef = 0.5283787788241139
ent_coef = 3.2373708014559846e-05
gae_lambda = 0.995
gamma = 0.9998378585413294
learning_rate = 0.00021863869242972936
