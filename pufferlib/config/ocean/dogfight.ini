[base]
env_name = puffer_dogfight
package = ocean
policy_name = DogfightPolicy
rnn_name = DogfightRecurrent

[policy]
hidden_size = 128

[vec]
num_envs = 8

[env]
reward_aim_scale = 0.001695
reward_closing_scale = 0.0001
penalty_neg_g = 0.03642
speed_min = 50
control_rate_penalty = 0.002
low_altitude_threshold = 857
low_altitude_penalty = 0.005
aim_decay_stage = 30
# Timestep-based shaping decay: anneals r_aim and r_closing during self-play
# This prevents spiral-and-aim behavior when both agents use shaping rewards
shaping_decay_start = 100000000
shaping_decay_end = 150000000

max_steps = 1283
num_envs = 1024
obs_scheme = 2

curriculum_enabled = 1
curriculum_randomize = 0
eval_spawn_mode = 0
fixed_stage = -1
max_stage = 20
eval_interval = 63000
warmup_steps = 1000000
min_eval_episodes = 50
total_timesteps = 400_000_000
num_workers = 8
finalize_margin = 0

# Self-play pool settings (Phase 2 - pool-based)
# policy_pool_dir = experiments/dogfight_pool  # Set via training script
opponent_selection = skill_match
opponent_swap_interval = 500000

# Dual self-play settings (Phase 3 - train_dual_selfplay.py)
# selfplay_min_stage: Only enable dual self-play after reaching this stage
# checkpoint_lag: Opponent is N checkpoints behind latest (1=2nd newest)
# perf_threshold: Clean win rate gate for opponent advancement
# min_checkpoint_gap: Minimum steps before saving new checkpoint
# max_checkpoints: Max selfplay checkpoints to keep (milestones always kept)
# These are passed via command line to train_dual_selfplay.py
# Default: selfplay_min_stage = 20
# Default: checkpoint_lag = 1
# Default: perf_threshold = 0.55
# Default: min_checkpoint_gap = 2_000_000
# Default: max_checkpoints = 20

# Domain randomization: 0.0 = off, 0.1 = +/-10% physics variation per-episode
domain_randomization = 0.05

# Vertical merge curriculum: probability of forced vertical spawn scenarios during self-play
vertical_spawn_prob = 0.035

# Opponent recovery hijacking (breaks death spiral equilibrium in self-play)
# When selfplay_active=1 and opponent is below threshold altitude while descending,
# there's a per-tick probability of hijacking controls to execute a recovery maneuver.
# This teaches the learner that spiraling won't reliably work because opponent may escape.
recovery_enabled = 1
recovery_altitude_threshold = 500
recovery_trigger_prob = 0.067
recovery_speed_threshold = 70
recovery_bank_deg = 60

# Self-play opponent curriculum (PFSP - Prioritized Fictitious Self-Play)
# Based on OpenAI Five (80/20 split) and AlphaStar (PFSP weighting)
[selfplay]
perf_threshold = 0.55
past_opponent_prob = 0.2
pfsp_exponent = 2.0
opponent_resample_interval = 1000000
pool_checkpoint_interval = 3419655
opponent_epoch_length = 2000000
mastery_streak = 2

# League training settings (league.py round/train)
# Opponent selection split for league training rounds
[league]
self_play_prob = 0.40
league_prob = 0.40
antiforgetting_prob = 0.20
opponent_resample_interval = 3000000
league_lr = 0.00005

[elo_eval]
enabled = 1
games_per_matchup = 20
reference_dir = pufferlib/ocean/dogfight/reference_opponents

[anchor_eval]
enabled = 0
interval = 50000000
games_per_anchor = 30
num_envs = 16
anchor_dir = pufferlib/ocean/dogfight/reference_opponents
strength_gate = 0.3

[train]
optimizer = muon
adam_beta1 = 0.9896
adam_beta2 = 0.9816
adam_eps = 1.49e-08
batch_size = auto
bptt_horizon = 64
checkpoint_interval = 200
clip_coef = 0.11
ent_coef = 0.0024
gae_lambda = 0.999
gamma = 0.99
learning_rate = 0.00045
max_grad_norm = 1.975
max_minibatch_size = 65536
minibatch_size = 65536
prio_alpha = 0.99
prio_beta0 = 0.99
seed = 42
total_timesteps = 400_000_000
update_epochs = 4
vf_clip_coef = 2.573
vf_coef = 4.493
vtrace_c_clip = 2.469
vtrace_rho_clip = 2.79

[sweep]
downsample = 1
goal = maximize
method = Protein
metric = anchor_rating
prune_pareto = True
use_gpu = True

[sweep.train.total_timesteps]
distribution = uniform
min = 400_000_000
mean = 650_000_001
max = 1_000_000_002
scale = auto

[sweep.env.reward_aim_scale]
distribution = uniform
min = 0.0001
max = 0.003
mean = 0.001
scale = auto

[sweep.env.penalty_neg_g]
distribution = uniform
min = 0.01
max = 0.05
mean = 0.02
scale = auto

[sweep.env.low_altitude_threshold]
distribution = uniform
min = 500.0
max = 2000.0
mean = 1500.0
scale = auto

[sweep.policy.hidden_size]
distribution = int_uniform
min = 64
max = 512
mean = 128
scale = 1.0

[sweep.env.obs_scheme]
distribution = int_uniform
min = 0
max = 2
mean = 1
scale = 1.0

[sweep.env.max_steps]
distribution = int_uniform
min = 300
max = 1500
mean = 1200
scale = 1.0

[sweep.env.eval_interval]
distribution = int_uniform
min = 25_000
max = 75_000
mean = 50_000
scale = 1.0

[sweep.env.warmup_steps]
distribution = int_uniform
min = 1_000_000
max = 3_000_000
mean = 2_000_000
scale = 1.0

[sweep.train.adam_eps]
distribution = log_normal
min = 1e-8
mean = 1e-6
max = 1e-5
scale = auto

[sweep.train.vf_coef]
distribution = uniform
min = 1.0
max = 5.0
mean = 3.0
scale = auto

[sweep.train.max_grad_norm]
distribution = uniform
min = 0.5
max = 2.0
mean = 1.0
scale = auto

[sweep.train.gae_lambda]
distribution = logit_normal
min = 0.9
max = 0.999
mean = 0.97
scale = auto

[sweep.env.recovery_trigger_prob]
distribution = uniform
min = 0.0
max = 0.1
mean = 0.05
scale = auto

# perf_threshold, mastery_streak: hardcoded (sweeping gate params when metric=strength is circular)
# perf_threshold = 0.55 (AlphaGo Zero style)
# mastery_streak = 2

[sweep.selfplay.opponent_epoch_length]
distribution = int_uniform
min = 2000000
max = 10000000
mean = 5000000
scale = 1.0

[sweep.env.vertical_spawn_prob]
distribution = uniform
min = 0.0
max = 0.10
mean = 0.05
scale = auto

[sweep.selfplay.pool_checkpoint_interval]
distribution = int_uniform
min = 2000000
max = 10000000
mean = 5000000
scale = 1.0
