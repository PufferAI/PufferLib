total_timesteps = 1.009999999999997e+08
update_epochs = 4
vf_clip_coef = 0.7800961518239151
vf_coef = 3.393582996566056
vtrace_c_clip = 1.4006243154417293
vtrace_rho_clip = 2.517622345679417

[sweep]
downsample = 1
goal = maximize
method = Protein
metric = perf
prune_pareto = True
use_gpu = True

[sweep.env.obs_scheme]
distribution = int_uniform
max = 5
mean = 2
min = 0
scale = 1.0

[sweep.env.penalty_alt_high]
distribution = uniform
max = 0.001
mean = 0.0002
min = 0.0
scale = auto

[sweep.env.penalty_alt_low]
