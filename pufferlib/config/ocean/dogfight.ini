[base]
package = ocean
env_name = puffer_dogfight
policy_name = Policy

[vec]
num_envs = 8

[env]
num_envs = 128
max_steps = 3000
obs_scheme = 0

# Reward weights (all clamped to [-1, 1], sweepable)
reward_kill = 1.0
reward_hit = 0.5
reward_dist_scale = 0.0001
reward_closing_scale = 0.002
reward_tail_scale = 0.05
reward_tracking = 0.05
reward_firing_solution = 0.1
penalty_alt_low = 0.0005
penalty_alt_high = 0.0002
penalty_stall = 0.002

# Thresholds (not swept)
alt_min = 200.0
alt_max = 2500.0
speed_min = 50.0

[train]
total_timesteps = 100_000_000
learning_rate = 0.0003
batch_size = 65536
minibatch_size = 16384
update_epochs = 4
gamma = 0.99
gae_lambda = 0.95
clip_coef = 0.2
vf_coef = 0.5
max_grad_norm = 0.5

[sweep]
method = Protein
metric = perf
goal = maximize
downsample = 1
use_gpu = True
prune_pareto = True

[sweep.train.total_timesteps]
distribution = log_normal
min = 1.0e8
max = 1.01e8
mean = 1.005e8
scale = time

[sweep.train.learning_rate]
distribution = log_normal
min = 0.00001
mean = 0.01
max = 0.05
scale = 0.5

# Sweep configs for observation scheme
[sweep.env.obs_scheme]
distribution = int_uniform
min = 0
max = 5
mean = 2
scale = 1.0

# NOTE: reward_kill is NOT swept - it's fixed at 1.0

[sweep.env.reward_hit]
distribution = uniform
min = 0.0
max = 1.0
mean = 0.5
scale = auto

[sweep.env.reward_dist_scale]
distribution = uniform
min = 0.0
max = 0.0005
mean = 0.0001
scale = auto

[sweep.env.reward_closing_scale]
distribution = uniform
min = 0.0
max = 0.005
mean = 0.002
scale = auto

[sweep.env.reward_tail_scale]
distribution = uniform
min = 0.0
max = 0.2
mean = 0.05
scale = auto

[sweep.env.reward_tracking]
distribution = uniform
min = 0.0
max = 0.5
mean = 0.05
scale = auto

[sweep.env.reward_firing_solution]
distribution = uniform
min = 0.0
max = 0.5
mean = 0.1
scale = auto

[sweep.env.penalty_alt_low]
distribution = uniform
min = 0.0
max = 0.002
mean = 0.0005
scale = auto

[sweep.env.penalty_alt_high]
distribution = uniform
min = 0.0
max = 0.001
mean = 0.0002
scale = auto

[sweep.env.penalty_stall]
distribution = uniform
min = 0.0
max = 0.005
mean = 0.002
scale = auto
