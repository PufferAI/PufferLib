[base]
env_name = puffer_dogfight
package = ocean
policy_name = Policy
rnn_name = Recurrent

[vec]
num_envs = 8

[env]
reward_aim_scale = 0.0005808280532994571
reward_closing_scale = 0.0006203900206209514
penalty_neg_g = 0.04393797329757981
speed_min = 50
control_rate_penalty = 0.003155535198639204
low_altitude_threshold = 500
low_altitude_penalty = 0.029378786024916437
aim_decay_stage = 30
# Timestep-based shaping decay: anneals r_aim and r_closing during self-play
# This prevents spiral-and-aim behavior when both agents use shaping rewards
shaping_decay_start = 100000000
shaping_decay_end = 150000000

max_steps = 1500
num_envs = 1024
obs_scheme = 0

curriculum_enabled = 1
curriculum_randomize = 0
eval_spawn_mode = 0
fixed_stage = -1
max_stage = 20
eval_interval = 100557
warmup_steps = 1640899
min_eval_episodes = 50
total_timesteps = 600_000_000
num_workers = 8
finalize_margin = 0

# Self-play pool settings (Phase 2 - pool-based)
# policy_pool_dir = experiments/dogfight_pool  # Set via training script
opponent_selection = skill_match
opponent_swap_interval = 500000

# Dual self-play settings (Phase 3 - train_dual_selfplay.py)
# selfplay_min_stage: Only enable dual self-play after reaching this stage
# checkpoint_lag: Opponent is N checkpoints behind latest (1=2nd newest)
# perf_threshold: Kill rate to trigger checkpoint save + opponent upgrade
# min_checkpoint_gap: Minimum steps before saving new checkpoint
# max_checkpoints: Max selfplay checkpoints to keep (milestones always kept)
# These are passed via command line to train_dual_selfplay.py
# Default: selfplay_min_stage = 20
# Default: checkpoint_lag = 1
# Default: perf_threshold = 0.65
# Default: min_checkpoint_gap = 2_000_000
# Default: max_checkpoints = 20

# Opponent recovery hijacking (breaks death spiral equilibrium in self-play)
# When selfplay_active=1 and opponent is below threshold altitude while descending,
# there's a per-tick probability of hijacking controls to execute a recovery maneuver.
# This teaches the learner that spiraling won't reliably work because opponent may escape.
recovery_enabled = 1
recovery_altitude_threshold = 500
recovery_trigger_prob = 0.8589073988175341
recovery_speed_threshold = 70
recovery_bank_deg = 60

[train]
optimizer = muon
adam_beta1 = 0.6655722600470635
adam_beta2 = 0.999249695852665
adam_eps = 0.0001
batch_size = auto
bptt_horizon = 64
checkpoint_interval = 200
clip_coef = 0.11432103835551204
ent_coef = 0.0021472102210990185
gae_lambda = 0.998220133863984
gamma = 0.98
learning_rate = 0.0005
max_grad_norm = 0.5
max_minibatch_size = 65536
minibatch_size = 65536
prio_alpha = 0.9773923074675496
prio_beta0 = 0.257160052397597
seed = 42
total_timesteps = 200_000_000
update_epochs = 4
vf_clip_coef = 5
vf_coef = 5
vtrace_c_clip = 5
vtrace_rho_clip = 1.405283488443427

[sweep]
downsample = 1
goal = maximize
method = Protein
metric = ultimate2
prune_pareto = True
use_gpu = True

[sweep.train.total_timesteps]
distribution = uniform
min = 200_000_000
mean = 400_000_001
max = 600_000_002
scale = auto

[sweep.env.reward_aim_scale]
distribution = uniform
min = 0.0001
max = 0.01
mean = 0.005
scale = auto

[sweep.env.reward_closing_scale]
