[base]
package = ocean
env_name = puffer_artymulti
policy_name = Policy
rnn_name = Recurrent

[vec]
num_envs = 1

[env]
num_envs = 1024
debug = 0

adj = 0.025
dist_fade = 0.2
frameskip = 1
max_dist0 = 300
max_reward_dist = 20
miss_penalty = -0.013
out_bounds_penalty = -0.1
turn_penalty = -0.05
turn_penalty_delay = 150
rng = 7

[policy]
hidden_size = 128

[rnn]
input_size = 128
hidden_size = 128

[train]
adam_beta1 = 0.8835662729737782
adam_beta2 = 0.9999789759165403
adam_eps = 1.1355964587845772e-12
batch_size = 65536
bptt_horizon = 64
clip_coef = 0.16142527841141888
ent_coef = 0.20000000000000004
gae_lambda = 0.967336890013527
gamma = 0.9
learning_rate = 0.05
max_grad_norm = 2.9512037319956743
#max_minibatch_size = 32768
#min_minibatch_size = 32768
minibatch_size = 8192 #16384 32768
prio_alpha = 0.15860745840264512
prio_beta0 = 0.7485498967772729
total_timesteps = 200_000_000
vf_clip_coef = 2.744695166940595
vf_coef = 4.388415326783197
vtrace_c_clip = 2.235817321458593
vtrace_rho_clip = 4.81141805429075

[sweep]
method = Protein
metric = score
goal = maximize
downsample = 10

