[sweep.env.adj]
distribution = uniform
min = 0.005
max = 0.05
mean = 0.025
scale = auto

[sweep.env.dist_fade]
distribution = uniform
min = 0.1
max = 0.5
mean = 0.1
scale = auto

[sweep.env.max_dist0]
distribution = uniform
min = 100.0
max = 300.0
mean = 275
scale = auto

[sweep.env.max_reward_dist]
distribution = uniform
min = 15
max = 50
mean = 25
scale = auto

[sweep.env.miss_penalty]
distribution = uniform
min = -0.1
max = -0.001
mean = -0.04
scale = auto

[sweep.env.turn_penalty]
distribution = uniform
min = -0.1
max = -0.01
mean = -0.08
scale = auto

[sweep.env.turn_penalty_delay]
distribution = uniform
min = 25
max = 100
mean = 65
scale = auto
