[base]
package = ocean
env_name = puffer_boids 
; policy_name = Boids
policy_name = Policy
rnn_name = Recurrent
; rnn_name = None

[env]
num_envs = 64
num_boids = 64
; num_envs = 1
; num_boids = 1
margin_turn_factor = 0.0
cohesion_factor = 0.00
seperation_factor = 1.00
alignment_factor = 0.00

[vec]
num_workers = 2
num_envs = 2
batch_size = auto

[train]
total_timesteps = 100_000_000
gamma = 0.95
learning_rate = 0.025
minibatch_size = 16384