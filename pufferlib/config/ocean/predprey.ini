[base]
package = ocean
env_name = puffer_predprey
rnn_name = Recurrent


[vec]
num_envs = 8

[env]
num_envs = 64
vision = 3
num_agents = 4
report_interval = 1
reward_death_scale = 1.0
reward_eat = 0
reward_collect = 0
timestep_reward = 0
reward_steal = 0
hp_reward_scale = 0
held_food_reward_scale = 0
food_base_spawn_rate = 1e-1

[train]
total_timesteps = 100_000_000
checkpoint_interval = 100
adam_beta1 = 0.9925640021442416
adam_beta2 = 0.9
adam_eps = 6.225983651908837e-10
bptt_horizon = 32
clip_coef = 1
ent_coef = 0.000999567018772538
gae_lambda = 0.9948939854010467
gamma = 0.9997469057538332
learning_rate = 0.008574057351505564
max_grad_norm = 1.8944338753964156
max_minibatch_size = 32768
minibatch_size = 65536
prio_alpha = 0.9328200510590207
prio_beta0 = 0.39879635697457694
vf_clip_coef = 0.9894773751752602
vf_coef = 0.6935921910790133
vtrace_c_clip = 5
vtrace_rho_clip = 4.6674443397379175


[sweep]
method = Protein 
metric = score
goal = maximize
downsample = 5
use_gpu = True
prune_pareto = True

[sweep.env.reward_death_scale]
distribution = uniform
min = 0.0
max = 1.0
mean = 1.0
scale = auto

[sweep.env.reward_eat]
distribution = uniform
min = -1.0
max = 1.0
mean = 0.0
scale = auto

[sweep.env.reward_collect]
distribution = uniform
min = -1.0
max = 1.0
mean = 0.0
scale = auto

[sweep.env.timestep_reward]
distribution = uniform
min = -1.0
max = 1.0
mean = 0.0
scale = auto


[sweep.env.reward_steal]
distribution = uniform
min = -1.0
max = 1.0
mean = 0.0
scale = auto


[sweep.env.hp_reward_scale]
distribution = uniform
min = 0.0
max = 1.0
mean = 0.0
scale = auto

[sweep.env.held_food_reward_scale]
distribution = uniform
min = 0.0
max = 1.0
mean = 0.0
scale = auto

[sweep.train.total_timesteps]
distribution = log_normal
min = 3e7
max = 1e10
mean = 2e8
scale = time