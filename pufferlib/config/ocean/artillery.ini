prio_alpha = 0.8573365561813164
prio_beta0 = 0.9145256572446854
total_timesteps = 100_000_000
vf_clip_coef = 0.1921803059597499
vf_coef = 0.9716703254857812
vtrace_c_clip = 1.3091691449874727
vtrace_rho_clip = 1.5308269023087249

[sweep]
method = Protein
metric = acc1000
goal = maximize
downsample = 10

