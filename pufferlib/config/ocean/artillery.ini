[base]
package = ocean
env_name = puffer_artillery
policy_name = Policy
rnn_name = Recurrent

[vec]
num_envs = 8

[env]
num_envs = 1024
width = 1280
height = 720
debug = 0
dist_fade = 0.3
frameskip = 1
ftmp1 = 100.0
ftmp2 = 50.0
ftmp3 = 0.22
ftmp4 = 0.1
method = -1
miss_penalty = -0.2
min_aim_angle = 0.56
max_aim_angle = 1.56
max_reward = 1.00
max_reward_dist = 30
max_dist0 = 250
max_score = 1.0
out_bounds_penalty = -0.1
target_min_x = 600
target_max_x = 1230
target_min_y = 300
target_max_y = 670
turn_penalty = -0.03
turn_penalty_delay = 75
turn_penalty_ramp = 0.015
render_many = 0
rng = 7
same_runs = 1
vm = 150

[policy]
hidden_size = 128

[rnn]
input_size = 128
hidden_size = 128

[train]
adam_beta1 = 0.9603485277769915
adam_beta2 = 0.9676992387435311
adam_eps = 9.4852806860935e-08
batch_size = auto
