[base]
package = ocean
env_name = puffer_boss_fight
policy_name = Policy

[vec]
num_envs = 1024
num_workers = 8
batch_size = auto
zero_copy = True
seed = 42

[env]

[policy]

[train]
name = boss_fight
project = boss_fight_experiments
data_dir = experiments
checkpoint_interval = 200
seed = 42
torch_deterministic = True
device = cpu
optimizer = adam
precision = float32
compile = False
total_timesteps = 5_000_000
learning_rate = 0.000864
anneal_lr = True
min_lr_ratio = 0.437
gamma = 0.983
gae_lambda = 0.902
update_epochs = 4
clip_coef = 0.421
vf_coef = 4.38
vf_clip_coef = 0.303
max_grad_norm = 2.28
ent_coef = 0.00623
minibatch_size = 2048
max_minibatch_size = 32768
bptt_horizon = 32
adam_beta1 = 0.991
adam_beta2 = 0.998
adam_eps = 1e-14
vtrace_rho_clip = 2.72
vtrace_c_clip = 2.13

[sweep]
goal = maximize
metric = episode_return
method = Protein
metric_distribution = linear
max_suggestion_cost = 3600
use_gpu = True

[sweep.train.learning_rate]
distribution = log_normal
min = 0.0001
max = 0.003

[sweep.train.ent_coef]
distribution = log_normal
min = 0.0001
max = 0.05

[sweep.train.gamma]
distribution = logit_normal
min = 0.95
max = 0.999

[sweep.train.gae_lambda]
distribution = logit_normal
min = 0.9
max = 0.99

[sweep.train.minibatch_size]
distribution = uniform_pow2
min = 1024
max = 8192
