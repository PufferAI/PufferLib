[base]
package = metta
env_name = metta 
policy_name = Policy
rnn_name = Recurrent

[vec]
num_envs = 64
num_workers = 16

[env]
render_mode = auto
ore_reward = 0.17088483842567775
battery_reward = 0.9882859711234822
heart_reward = 1.0

[train]
total_timesteps = 300_000_000
batch_size = auto
optimizer = adam
adam_beta1 = 0.9
adam_beta2 = 0.999
adam_eps = 1e-12
clip_coef = 0.1
ent_coef = 0.0021
gae_lambda = 0.916
gamma = 0.977
learning_rate = 0.0003
max_grad_norm = 0.5
minibatch_size = 32768
bptt_horizon = 64
prio_alpha = 0.0
prio_beta0 = 0.6
vf_clip_coef = 0.1
vf_coef = 0.44
vtrace_c_clip = 1.0
vtrace_rho_clip = 1.0
anneal_lr = True
target_kl = 0.01

[sweep]
metric = agent/heart.gained

[sweep.train.total_timesteps]
distribution = log_normal
min = 1e8
max = 5e8
mean = 3e8
scale = auto

[sweep.env.ore_reward]
distribution = uniform
min = 0.0
mean = 0.25
max = 1.0
scale = auto

[sweep.env.battery_reward]
distribution = uniform
min = 0.0
mean = 0.5
max = 1.0
scale = auto

[sweep.env.heart_reward]
distribution = uniform
min = 0.0
mean = 1.0
max = 1.0
scale = auto
