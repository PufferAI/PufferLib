[base]
env_name = robocode
checkpoint_interval = 100

[vec]
total_agents = 16384
num_buffers = 4
num_threads = 4
num_policies = 1
hist_policy_percent = 0.0
hist_policy_hidden_size = 256
hist_policy_num_layers = 4

[selfplay]
enabled = 0
max_size = 100
seed = 42
opp_timeout_steps = 100000000
eval_games = 4096
eval_pool_size = 8

[env]
num_agents = 1
num_bots = 1
width = 800
height = 600
reward_damage = 0.0
reward_spot = 0.0
reward_melee_damage_inflicted = 0.007448376232810955
reward_damage_taken = -0.004918136926337855
reward_range_damage_inflicted = 0.017177545879507577
dr = 0.6
bot_policy = 3
max_ticks = 3000

[policy]
hidden_size = 256
num_layers = 4

[train]
gpus = 1
# vs wave-surfer confirmation. Do not start from the 14B repro.
total_timesteps = 200_000_000
learning_rate = 0.0072914747025563794
gamma = 0.9996207050319893
gae_lambda = 0.8883938238847433
minibatch_size = 8192
horizon = 128

[sweep.train.total_timesteps]
distribution = log_normal
min = 5e8
max = 1e11
mean = 5e8
scale = auto

[sweep.policy.hidden_size]
distribution = uniform_pow2
min = 32
max = 1024
scale = auto

[sweep.policy.num_layers]
distribution = uniform
min = 1
max = 8
scale = auto

[sweep.env.dr]
distribution = uniform
min = 0.0
max = 0.6
mean = 0.3
scale = auto

[sweep.env.reward_melee_damage_inflicted]
distribution = uniform
min = 0.0
max = 0.02
mean = 0.005
scale = auto

[sweep.env.reward_range_damage_inflicted]
distribution = uniform
min = 0.0
max = 0.02
mean = 0.005
scale = auto

[sweep.env.reward_damage_taken]
distribution = uniform
min = -0.02
max = 0.0
mean = -0.005
scale = auto
