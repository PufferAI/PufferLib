[base]
env_name = battle

[policy]
# 64x2: ~34k weights vs old 512x2 ~1.65M. Web infers 128 agents/frame.
hidden_size = 64
num_layers = 2

[vec]
# 32 envs × 128 trainable slots. Must be divisible by num_agents and by
# minibatch/horizon (default 8192/64=128).
total_agents = 4096
num_buffers = 4
num_threads = 4

[env]
num_agents = 128
num_armies = 2
width = 1980
height = 1020
size_x = 2
size_y = 1.0
size_z = 2

[train]
total_timesteps = 50_000_000
learning_rate = 0.0015
gamma = 0.99
minibatch_size = 8192
horizon = 64

