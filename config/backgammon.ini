[base]
env_name = backgammon

[vec]
total_agents = 4096
num_buffers = 4
num_threads = 8

[env]
opponent_random_prob = 1.0

[policy]
hidden_size = 256
num_layers = 2

[train]
gpus = 1
total_timesteps = 10_000_000
learning_rate = 0.001
anneal_lr = 1
min_lr_ratio = 0
gamma = 0.99
gae_lambda = 0.95
replay_ratio = 1.0
clip_coef = 0.2
vf_coef = 2.0
vf_clip_coef = 0.2
max_grad_norm = 1.5
ent_coef = 0.001
momentum = 0.95
minibatch_size = 8192
horizon = 64
