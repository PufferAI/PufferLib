[base]
env_name = admiral
checkpoint_interval = 8
seed = 42

[vec]
total_agents = 4096
num_buffers = 1
num_threads = 4
num_policies = 2
hist_policy_percent = 0.1
hist_policy_hidden_size = 128
hist_policy_num_layers = 2

[selfplay]
enabled = 1
max_size = 100
seed = 42
opp_timeout_steps = 16_777_216
eval_games = 4096
eval_pool_size = 8

[env]
num_agents = 2 # Must match N_TEAMS; also used by the shared evaluator.
num_bots = 0
obs_scheme = 1
curriculum_level = 1
width = 2000
height = 2000
reward_damage_mult = 0.5
reward_kill = 0.2
penalty_hit_ally = -0.5
penalty_used_volley = -0.005
penalty_stationary = -0.015

[policy]
hidden_size = 128
num_layers = 2

[train]
gpus = 1
total_timesteps = 268_435_456
learning_rate = 0.00214707246
anneal_lr = 0
gamma = 0.995000005
gae_lambda = 0.980000019
replay_ratio = 1
clip_coef = 0.100000001
vf_coef = 1.41562486
vf_clip_coef = 0.484500945
max_grad_norm = 0.5
ent_coef = 1.58769835e-05
anneal_ent_coef = 0
momentum = 0.986418724
minibatch_size = 8192
horizon = 128

[sweep]
# Self-play pool evaluation replaces this training metric as Protein's objective.
metric = perf
metric_distribution = linear
goal = maximize
max_runs = 1000
gpus = 1
downsample = 32
prune_pareto = True

[sweep.train.total_timesteps]
distribution = uniform_pow2
min = 268_435_456
max = 536_870_912
scale = time

[sweep.train.learning_rate]
distribution = log_normal
min = 0.00005
max = 0.003
scale = 0.5

[sweep.train.ent_coef]
distribution = log_normal
min = 0.00001
max = 0.001
scale = auto

[sweep.train.gamma]
