[base]
env_name = fight_caves
checkpoint_interval = 50
# Synchronous training and a recurrent-state reset each horizon.
reset_every_horizon = 1
async = 0

# Fight Caves starting supplies and reward settings.
[env]
initial_sharks = 0
initial_prayer_doses = 0
w_progress = 0.001
w_damage_taken = -0.25
w_cave_complete = 1.0
w_player_death = -1.0
w_prayer_lost = -0.02
w_invalid_action = -0.1
w_tick_penalty = -0.0001
shape_npc_heal_penalty = -0.005
shape_no_progress_start_1 = 800
shape_no_progress_start_2 = 1600
shape_no_progress_start_3 = 2400
shape_no_progress_penalty_1 = -0.001
shape_no_progress_penalty_2 = -0.005
shape_no_progress_penalty_3 = -0.02
shape_no_attack_start = 50
shape_no_attack_base_penalty = -0.005
shape_no_attack_wave_scale = 0.05

[vec]
num_threads = 16

[train]
total_timesteps = 500_000_000
anneal_lr = 0
learning_rate = 0.000800000038
ent_coef = 0.000221859314
gamma = 0.9991261141073255
horizon = 256
minibatch_size = 32768
replay_ratio = 2.08926511
clip_coef = 0.0466209911
vf_coef = 0.158951879
vf_clip_coef = 0.185629278
max_grad_norm = 0.400000006
# Enable 5.0's V-trace path explicitly so these clip settings take effect.
vtrace = 1
vtrace_rho_clip = 2.0
vtrace_c_clip = 0.9746667741536915
# Muon momentum.
momentum = 0.994000018

[policy]
hidden_size = 512
num_layers = 3

[sweep]
metric = jad_kill_rate
