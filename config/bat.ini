[base]
env_name = bat

[vec]
total_agents = 4096
num_buffers = 4
num_threads = 8

[policy]
hidden_size = 128
num_layers = 4

[torch]
network = MinGRU
encoder = DefaultEncoder
decoder = DefaultDecoder

[env]
num_agents = 1
frameskip = 1
width = 64
height = 64
num_obstacles = 3
bat_radius = 2.0
ear_separation_scale = 2.194554
bug_radius = 1.5
bat_max_speed = 20.352376
bat_min_speed = 2.0
bat_accel = 40.0
bat_turn_rate = 9.424778
bug_speed = 4.0
max_steps = 512
render_target_fps = 60
curriculum_enabled = 1
curriculum_initial_level = 2
curriculum_start_obstacles = 0
curriculum_max_obstacles = 3
curriculum_obstacle_step = 4
curriculum_successes_per_level = 16
curriculum_start_bug_distance = 8.0
curriculum_max_bug_distance = 56.0
curriculum_bug_distance_step = 5.0
freq_bins_per_ear = 16
max_echo_range = 80.0
sound_speed = 180.0
reflector_spacing = 8.0
max_chirp_age_ticks = 30
chirp_cooldown_ticks = 12
max_chirps_per_episode = 15
chirp_cost = 0.0
chirp_efficiency_reward = 2.0
valid_chirp_reward = 0.0000106
early_chirp_penalty = 0.006
chirp_overlap_penalty = 0.012
bug_echo_reward_scale = 0.235466
bug_echo_farther_penalty_scale = 0.167897
bug_echo_min_displacement = 1.0
step_cost = 0.000193626
progress_reward_scale = 0.12
collision_penalty = 1.27806

[train]
total_timesteps = 47_352_761
learning_rate = 0.0193521
gamma = 0.998791
gae_lambda = 0.969562
replay_ratio = 1.17746
clip_coef = 0.2
vf_coef = 2.0
vf_clip_coef = 0.2
max_grad_norm = 1.5
ent_coef = 0.0005
beta1 = 0.95
beta2 = 0.999
eps = 1e-12
minibatch_size = 8192
horizon = 64
vtrace_rho_clip = 1.0
vtrace_c_clip = 1.0
prio_alpha = 0.8
prio_beta0 = 0.2

[sweep]
method = Protein
metric = perf
metric_distribution = linear
goal = maximize
max_runs = 8
gpus = 1
downsample = 5
use_gpu = True
match_enemy_model_path = {}
match_num_games = {}
match_enemy_hidden_size = {}
match_enemy_num_layers = {}

[sweep.train.total_timesteps]
distribution = log_normal
min = 30_000_000
max = 50_000_000
scale = auto

[sweep.train.learning_rate]
distribution = log_normal
min = 0.01
max = 0.05
scale = auto

