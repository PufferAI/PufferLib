[base]
env_name = bat

[vec]
total_agents = 4096
num_buffers = 8
num_threads = 8

[policy]
hidden_size = 128
num_layers = 4

[torch]
network = MinGRU
encoder = DefaultEncoder
decoder = DefaultDecoder

[env]
num_agents = 1
frameskip = 1
width = 64
height = 64
num_obstacles = 3
bat_radius = 2.0
bug_radius = 1.5
bat_max_speed = 12.0
bat_accel = 30.0
bat_turn_rate = 3.1415926
bug_speed = 4.0
max_steps = 512
range_bins_per_ear = 16
doppler_bins_per_ear = 16
max_echo_range = 80.0
sound_speed = 100.0
reflector_spacing = 8.0
max_chirp_age_ticks = 30
chirp_cost = 0.0005
step_cost = 0.001
progress_reward_scale = 0.05
collision_penalty = 1.0

[train]
total_timesteps = 10_000_000
learning_rate = 0.015
gamma = 0.995
gae_lambda = 0.90
replay_ratio = 1.0
clip_coef = 0.2
vf_coef = 2.0
vf_clip_coef = 0.2
max_grad_norm = 1.5
ent_coef = 0.001
beta1 = 0.95
beta2 = 0.999
eps = 1e-12
minibatch_size = 8192
horizon = 64
vtrace_rho_clip = 1.0
vtrace_c_clip = 1.0
prio_alpha = 0.8
prio_beta0 = 0.2
