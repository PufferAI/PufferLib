[base]
env_name = bat

[vec]
total_agents = 4096
num_buffers = 8
num_threads = 8

[policy]
hidden_size = 128
num_layers = 4

[torch]
network = MinGRU
encoder = DefaultEncoder
decoder = DefaultDecoder

[env]
num_agents = 1
frameskip = 1
width = 64
height = 64
num_obstacles = 3
bat_radius = 2.0
ear_separation_scale = 2.0
bug_radius = 1.5
bat_max_speed = 11.9
bat_accel = 60.0
bat_turn_rate = 6.2831853
bug_speed = 4.0
max_steps = 512
curriculum_enabled = 1
curriculum_initial_level = 3
curriculum_start_obstacles = 1
curriculum_max_obstacles = 3
curriculum_obstacle_step = 18
curriculum_successes_per_level = 21
curriculum_start_bug_distance = 8.0
curriculum_max_bug_distance = 56.0
curriculum_bug_distance_step = 4.0
freq_bins_per_ear = 16
max_echo_range = 80.0
sound_speed = 120.0
reflector_spacing = 8.0
max_chirp_age_ticks = 30
chirp_cooldown_ticks = 12
chirp_cost = 0.0
valid_chirp_reward = 0.00005
early_chirp_penalty = 0.0043
bug_echo_reward_scale = 0.13
step_cost = 0.0002
progress_reward_scale = 0.076
collision_penalty = 1.0

[train]
total_timesteps = 50_000_000
learning_rate = 0.027
gamma = 0.994
gae_lambda = 0.98
replay_ratio = 1.25
clip_coef = 0.2
vf_coef = 2.0
vf_clip_coef = 0.2
max_grad_norm = 1.5
ent_coef = 0.002
beta1 = 0.95
beta2 = 0.999
eps = 1e-12
minibatch_size = 8192
horizon = 64
vtrace_rho_clip = 1.0
vtrace_c_clip = 1.0
prio_alpha = 0.8
prio_beta0 = 0.2

[sweep]
method = Protein
metric = perf
metric_distribution = linear
goal = maximize
max_runs = 8
gpus = 1
downsample = 5
use_gpu = True
sweep_only = total_timesteps,learning_rate,gamma,gae_lambda,ent_coef,horizon,replay_ratio,num_buffers,bat_max_speed,bat_accel,bat_turn_rate,step_cost,sound_speed,ear_separation_scale,progress_reward_scale,valid_chirp_reward,early_chirp_penalty,bug_echo_reward_scale,collision_penalty,curriculum_initial_level,curriculum_start_bug_distance,curriculum_bug_distance_step,curriculum_obstacle_step,curriculum_successes_per_level
match_enemy_model_path = {}
match_num_games = {}
match_enemy_hidden_size = {}
match_enemy_num_layers = {}

[sweep.train.total_timesteps]
distribution = log_normal
min = 30_000_000
max = 50_000_000
scale = auto

[sweep.train.learning_rate]
distribution = log_normal
min = 0.01
max = 0.05
scale = auto

[sweep.train.gamma]
distribution = logit_normal
min = 0.98
max = 0.9995
scale = auto

[sweep.train.gae_lambda]
distribution = logit_normal
min = 0.92
max = 0.98
scale = auto

[sweep.train.ent_coef]
distribution = log_normal
min = 0.0005
max = 0.03
scale = auto

[sweep.train.horizon]
distribution = uniform_pow2
min = 32
max = 128
scale = auto

[sweep.train.replay_ratio]
distribution = uniform
min = 0.75
max = 1.25
scale = auto

[sweep.vec.num_buffers]
distribution = int_uniform
min = 4
max = 8
scale = auto

[sweep.env.bat_max_speed]
distribution = uniform
min = 8.0
max = 22.0
scale = auto

[sweep.env.bat_accel]
distribution = uniform
min = 40.0
max = 90.0
scale = auto

[sweep.env.bat_turn_rate]
