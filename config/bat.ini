min = 4.0
max = 9.4247780
scale = auto

[sweep.env.step_cost]
distribution = uniform
min = 0.0001
max = 0.0008
scale = auto

[sweep.env.sound_speed]
distribution = uniform
min = 80.0
max = 180.0
scale = auto

[sweep.env.ear_separation_scale]
distribution = uniform
min = 1.0
max = 3.0
scale = auto

[sweep.env.progress_reward_scale]
