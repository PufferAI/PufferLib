# 1024x4 skip-obs + rand_r (headskip1024 / 0935 hparams).
# 1-GPU train: perf 0.504 / score 114.0 at 3.493e9 steps.
# Original LCG 0935 on craftax_clean: train 0.514 / 119; frozen eval ~112 / 0.485.
# Frozen LCG weights: craftax_114.bin (same bytes as /puffertank/docker/craftax_best.bin).
# Skip-obs 1-GPU retrain: logs/craftax/headskip1024.ini (0.504 / 114).
# Weights: craftax_headskip1024.bin (near-final 3.460e9-step ckpt; the 3.493e9
# final file on vast matched 114.bin and was not used).
# Do not use 4096 agents on 8 GPUs with this LR — scale8 collapsed (old_kl ~0.20).

[base]
env_name = craftax
seed = 73
checkpoint_interval = 200
eval_episodes = 10000

[vec]
total_agents = 2048
num_buffers = 4
num_threads = 8

[env]
reset_pool_size = 8192
action_mask = 1

[policy]
hidden_size = 1024
num_layers = 4

[train]
total_timesteps = 3.49332992e+09
learning_rate = 0.00472887093
gamma = 0.999414682
gae_lambda = 0.801190972
replay_ratio = 1.17263889
clip_coef = 0.226401091
vf_coef = 0.78808409
vf_clip_coef = 1.14975154
max_grad_norm = 0.818616688
ent_coef = 0.000213571053
momentum = 0.930526733
minibatch_size = 32768
