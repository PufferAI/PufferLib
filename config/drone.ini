[base]
env_name = drone
# 5c default async=1 (stale actor) prevents one-policy hover+race from learning.
async = 0
# Zero RNN state every horizon. Constellation 0.99 runs all used reset_state=1.
# Carry (default 0) mixes hover/race hidden state across tasks.
reset_every_horizon = 1

[vec]
total_agents = 2048
num_buffers = 8
num_threads = 1

[env]
num_drones = 64

# multi-task step fractions
hover_frac = 0.8332634358752755
race_frac = 0.6878962707768624
sphere_frac = 0.0
cube_frac = 0.0
flag_frac = 0.0

# domain randomisation
dr = 0.05

# integrator, rk4 by default
use_rk2 = 0

# shared rewards
alpha_vel = 0.0
alpha_omega = 0.0
alpha_action = 0.0

# hover
sphere_radius = 4.0
hover_target_dist = 5
hover_horizon = 1024
alpha_hover = 1
hover_alpha_dist = 0.8120191629018807

# race
max_rings = 10
race_horizon = 2048
ring_reward = 2.4450236350884
race_alpha_dist = 2.8630645575928786

[policy]
hidden_size = 64
num_layers = 2

[train]
anneal_ent_coef = 0
anneal_lr = 1
momentum = 0.9349722808636886
clip_coef = 0.05128371403269373
ent_coef = 4.696130967260617e-05
gae_lambda = 0.9482649804656037
gamma = 0.9881859783105877
gpus = 1
horizon = 64
learning_rate = 0.009470453254078422
max_grad_norm = 1.4133356803570938
min_ent_coef_ratio = 0.1
min_lr_ratio = 0
minibatch_size = 16384
prio_alpha = 0.2056097946119157
prio_beta0 = 0.7547212669825754
replay_ratio = 2.253065396569355
total_timesteps = 88_650_750
vf_clip_coef = 1.200252076345663
vf_coef = 0.11125903992665012
vtrace_c_clip = 2.902740049693881
vtrace_rho_clip = 1.5005124861512968

[sweep]
metric = perf

[sweep.train.total_timesteps]
distribution = log_normal
min = 3e7
max = 2e8
mean = 8e7
scale = auto

# hover
[sweep.env.hover_alpha_dist]
distribution = log_normal
min = 0.001
max = 10.0
mean = 1.0
scale = auto

[sweep.env.alpha_hover]
distribution = log_normal
min = 0.0001
max = 1.0
mean = 0.01
scale = auto

# race
[sweep.env.race_alpha_dist]
distribution = log_normal
min = 0.001
max = 10.0
mean = 1.0
scale = auto

[sweep.env.ring_reward]
distribution = log_normal
min = 0.1
max = 100.0
mean = 1.0
scale = auto

# fracs
[sweep.env.hover_frac]
distribution = uniform
min = 0.1
max = 1.0
scale = auto

[sweep.env.race_frac]
distribution = uniform
min = 0.1
max = 1.0
scale = auto
