[base]
env_name = drone
# 5c default async=1 (stale actor) prevents one-policy hover+race from learning.
async = 1
# Zero RNN state every horizon. Constellation 0.99 runs all used reset_state=1.
# Carry (default 0) mixes hover/race hidden state across tasks.
reset_every_horizon = 0

[vec]
total_agents = 8192
num_buffers = 8
num_threads = 1

[env]
num_drones = 64

# multi-task step fractions
hover_frac = 0.673539639
race_frac = 0.882187724
sphere_frac = 0.0
cube_frac = 0.0
flag_frac = 0.0

# domain randomisation
dr = 0.05

# integrator, rk4 by default
use_rk2 = 0

# shared rewards
alpha_vel = 0.0
alpha_omega = 0.002
alpha_action = 0.0
oob_penalty = 0

# hover
sphere_radius = 4.0
hover_target_dist = 5
hover_horizon = 1024
alpha_hover = 0.154869527
hover_alpha_dist = 0.676495731

# race
max_rings = 10
race_horizon = 2048
ring_reward = 1
race_alpha_dist = 0.947621644

[policy]
hidden_size = 64
num_layers = 2

[train]
momentum = 0.88409394
clip_coef = 0.32394895
ent_coef = 0.000127019011
gae_lambda = 0.989830613
gamma = 0.990013301
horizon = 64
learning_rate = 0.00867387839
max_grad_norm = 1.5
minibatch_size = 16384
replay_ratio = 3.97863984
total_timesteps = 89150896
vf_clip_coef = 4.14942741
vf_coef = 0.354031146

[sweep]
metric = perf

[sweep.train.total_timesteps]
distribution = log_normal
min = 3e7
max = 2e8
scale = auto

[sweep.env.alpha_hover]
distribution = log_normal
min = 0.0001
max = 1.0
scale = auto

[sweep.env.hover_alpha_dist]
distribution = log_normal
min = 0.001
max = 1.0
scale = auto

[sweep.env.race_alpha_dist]
distribution = log_normal
min = 0.001
max = 1.0
scale = auto

[sweep.env.ring_reward]
distribution = uniform
min = 0.0
max = 1.0
scale = auto

[sweep.env.oob_penalty]
distribution = uniform
min = 0.0
max = 1.0
scale = auto

# fracs
[sweep.env.hover_frac]
distribution = uniform
min = 0.1
max = 1.0
scale = auto

[sweep.env.race_frac]
distribution = uniform
min = 0.1
max = 1.0
scale = auto
