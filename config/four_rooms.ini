[base]
env_name = four_rooms

[vec]
total_agents = 4096
num_buffers = 2
num_threads = 8

[env]
size = 19

[policy]
hidden_size = 256
num_layers = 6
expansion_factor = 1

[train]
total_timesteps = 300_000_000
gamma = 0.99
gae_lambda = 0.95
learning_rate = 0.005
minibatch_size = 32768
horizon = 64
ent_coef = 0.01

[sweep]
metric = score
metric_distribution = linear
goal = maximize
max_runs = 100
gpus = 1
downsample = 5
sweep_only = hidden_size,num_layers,total_timesteps,learning_rate

[sweep.policy.hidden_size]
distribution = uniform_pow2
min = 64
max = 1024
mean = 256
scale = auto

[sweep.policy.num_layers]
distribution = int_uniform
min = 1
max = 4
mean = 2
scale = auto

[sweep.train.total_timesteps]
distribution = log_normal
min = 20_000_000
max = 500_000_000
mean = 100_000_000
scale = auto

[sweep.train.learning_rate]
distribution = log_normal
min = 0.0005
max = 0.01
scale = auto
