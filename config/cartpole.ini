[base]
env_name = cartpole

[vec]
total_agents = 4096
num_buffers = 4
num_threads = 16

[env]
cart_mass = 1
pole_mass = 0.1
pole_length = 0.5
gravity = 9.8
force_mag = 10
dt = 0.02
continuous = 0

[policy]
hidden_size = 32
num_layers = 2.11327

[train]
gpus = 1
total_timesteps = 15000000
learning_rate = 0.05
anneal_lr = 1
min_lr_ratio = 0
gamma = 0.99
gae_lambda = 0.95
replay_ratio = 1.0
clip_coef = 0.143548
vf_coef = 1.77975
vf_clip_coef = 3.90833
max_grad_norm = 0.329667
ent_coef = 0.01
momentum = 0.942691
minibatch_size = 16384
horizon = 32
vtrace_rho_clip = 2.91145
vtrace_c_clip = 1.66148
prio_alpha = 0.786776
prio_beta0 = 0.348617
use_rnn = 1

[sweep]
metric = perf

[sweep.train.total_timesteps]
distribution = log_normal
min = 5e6
max = 2e7
mean = 1e7
