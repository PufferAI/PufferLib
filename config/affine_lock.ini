[base]
env_name = affine_lock

[vec]
total_agents = 4096
num_buffers = 2
num_threads = 16

[policy]
hidden_size = 256
num_layers = 3

[env]
seed = 42
start_depth = 2
max_depth = 16
step_grace = 0

[train]
total_timesteps = 200_000_000
horizon = 64
minibatch_size = 8192
learning_rate = 0.012
ent_coef = 0.2
gamma = 0.8
gae_lambda = 0.995
replay_ratio = 3.0
clip_coef = 0.83
vf_coef = 4.75
vf_clip_coef = 0.8
max_grad_norm = 3.0
beta1 = 0.5
beta2 = 0.9915
eps = 0.0001
vtrace_rho_clip = 1.4
vtrace_c_clip = 3.75
prio_alpha = 0.055
prio_beta0 = 0.161

[sweep]
metric = perf
goal = maximize
max_runs = 50
use_gpu = False

[sweep.train.total_timesteps]
distribution = log_normal
min = 100_000_000
max = 200_000_000
mean = 200_000_000
scale = time

[sweep.vec.total_agents]
distribution = uniform_pow2
min = 4096
max = 16384
mean = 4096
scale = auto

[sweep.policy.hidden_size]
distribution = uniform_pow2
min = 64
max = 512
mean = 256
scale = auto

[sweep.policy.num_layers]
distribution = uniform
min = 1
max = 4
mean = 3
scale = auto

[sweep.vec.num_buffers]
distribution = uniform
min = 1
max = 4
mean = 2
scale = auto

[sweep.train.horizon]
distribution = uniform_pow2
min = 32
max = 128
mean = 64
scale = auto

[sweep.train.minibatch_size]
distribution = uniform_pow2
min = 8192
max = 131072
mean = 8192
scale = auto

[sweep.train.replay_ratio]
distribution = uniform
min = 1.0
max = 4.0
mean = 3.0
scale = auto

[sweep.train.learning_rate]
mean = 0.012

[sweep.train.ent_coef]
mean = 0.2

[sweep.train.gamma]
mean = 0.8

[sweep.train.gae_lambda]
mean = 0.995

[sweep.train.vtrace_rho_clip]
mean = 1.4

[sweep.train.vtrace_c_clip]
mean = 3.75

[sweep.train.clip_coef]
mean = 0.83

[sweep.train.vf_clip_coef]
distribution = uniform
min = 0.001
max = 5.0
mean = 0.8
scale = auto

[sweep.train.vf_coef]
distribution = uniform
min = 0.1
max = 8.0
mean = 4.75
scale = auto

[sweep.train.max_grad_norm]
mean = 3.0

[sweep.train.beta1]
mean = 0.5

[sweep.train.beta2]
mean = 0.9915

[sweep.train.eps]
mean = 0.0001

[sweep.train.prio_alpha]
mean = 0.055

[sweep.train.prio_beta0]
mean = 0.161
