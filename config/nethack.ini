[base]
env_name = nethack
reset_every_horizon = 0
async = 1

[vec]
total_agents = 512
num_buffers = 4
num_threads = 32

[env]
gold_coef = 0.00267383433
exp_coef = 0.112984791
descent_coef = 0.762886882
# pays once per new unique (dnum, dlevel) floor entered (branches count)
floor_coef = 0.0
xp_coef = 0.2399306
scout_coef = 0.0104040429
ac_coef = 0.0
death_penalty = -0.324047506

# flags
# scout reward scales with xp level relative to depth; <= 0 disables
scout_ready = 0.0
# fraction of protection-spell AC excluded from the ac reward; 1 = armor only
ac_nospell = 1.0
# 1 removes the verb from the action space
mask_search20 = 0
mask_run = 0
# 1 = random role/race/gender/align per reset (challenge protocol)
multi_role = 1

[policy]
hidden_size = 512
num_layers = 3

[train]
total_timesteps = 1_000_000_000
minibatch_size = 4096
horizon = 128
learning_rate = 0.000765701407
momentum = 0.987343371
verb_eps = 0.005
verb_eps_anneal_start = 0.4
verb_eps_anneal_end = 1.0
gamma = 0.998305142
gae_lambda = 0.265489638
replay_ratio = 1.68762803
clip_coef = 0.100000001
vf_coef = 4
vf_clip_coef = 0.00999999978
max_grad_norm = 0.961730838
ent_coef = 0.0229146201
anneal_lr = 1
anneal_ent_coef = 0
min_lr_ratio = 0.0
min_ent_coef_ratio = 0.1
vtrace_rho_clip = 1.0
vtrace_c_clip = 1.0

[sweep]
metric = score

[sweep.train.total_timesteps]
distribution = log_normal
min = 2e8
max = 1e9
scale = time

[sweep.env.exp_coef]
distribution = log_normal
min = 0.01
max = 0.2
scale = auto

[sweep.env.gold_coef]
distribution = log_normal
min = 0.001
max = 0.1
scale = auto

[sweep.env.descent_coef]
distribution = uniform
min = 0.0
max = 1.0
scale = auto

[sweep.env.xp_coef]
distribution = uniform
min = 0.0
max = 1.0
scale = auto

[sweep.env.scout_coef]
distribution = log_normal
min = 0.001
max = 0.1
scale = auto

[sweep.env.death_penalty]
distribution = uniform
min = -1.0
max = 0.0
scale = auto

[sweep.train.verb_eps]
distribution = log_normal
min = 0.0005
max = 0.02
scale = auto

[sweep.train.verb_eps_anneal_start]
distribution = uniform
min = 0.2
max = 0.8
scale = auto

[sweep.env.ac_coef]
distribution = log_normal
min = 0.01
max = 2.0
scale = auto

[sweep.env.floor_coef]
distribution = uniform
min = 0.0
max = 1.0
scale = auto
