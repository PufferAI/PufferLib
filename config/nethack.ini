[base]
env_name = nethack

[vec]
total_agents = 512
num_buffers = 4
num_threads = 32

[env]
gold_coef = 0.096887961
score_coef = 0
exp_coef = 0.041234985
descent_coef = 1.0
floor_coef = 0.38962388
xp_coef = 0.741106272
scout_coef = 0.000813971157
death_penalty = -0.286484599

# flags
# 1 removes the verb from the action space
mask_search20 = 0
mask_run = 0
# 1 = random role/race/gender/align per reset (challenge protocol)
multi_role = 1

[policy]
hidden_size = 512
num_layers = 3

[train]
total_timesteps = 1_000_000_000
minibatch_size = 4096
horizon = 256
learning_rate = 0.00154131022
momentum = 0.956484258
verb_eps = 0.005
verb_eps_anneal_start = 0.4
verb_eps_anneal_end = 1.0
gamma = 0.999329984
gae_lambda = 0.199999988
replay_ratio = 1.20105004
clip_coef = 0.36599344
vf_coef = 0.882273436
vf_clip_coef = 1.30713189
max_grad_norm = 0.335048616
ent_coef = 0.00555205066
anneal_lr = 1
anneal_ent_coef = 0
min_lr_ratio = 0.0
min_ent_coef_ratio = 0.1
vtrace_rho_clip = 1.0
vtrace_c_clip = 1.0

[sweep]
metric = score

[sweep.train.total_timesteps]
distribution = log_normal
min = 2e8
max = 1e9
scale = time

[sweep.env.exp_coef]
distribution = log_normal
min = 0.001
max = 0.1
scale = auto

[sweep.env.score_coef]
distribution = log_normal
min = 0.001
max = 0.1
scale = auto

[sweep.env.gold_coef]
distribution = log_normal
min = 0.001
max = 0.1
scale = auto

[sweep.env.descent_coef]
distribution = uniform
min = 0.0
max = 1.0
scale = auto

[sweep.env.xp_coef]
distribution = uniform
min = 0.0
max = 1.0
scale = auto

[sweep.env.scout_coef]
distribution = log_normal
min = 0.0001
max = 0.1
scale = auto

[sweep.env.death_penalty]
distribution = uniform
min = -1.0
max = 0.0
scale = auto

[sweep.train.verb_eps]
distribution = log_normal
min = 0.0005
max = 0.02
scale = auto

[sweep.train.verb_eps_anneal_start]
distribution = uniform
min = 0.2
max = 0.8
scale = auto

[sweep.env.floor_coef]
distribution = uniform
min = 0.0
max = 1.0
scale = auto
