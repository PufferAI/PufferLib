[base]
env_name = nethack

[vec]
total_agents = 512
num_buffers = 4
num_threads = 32

[env]
gold_coef = 0.0338042788
score_coef = 0.00105150591
exp_coef = 0.0602242909
descent_coef = 1.0
floor_coef = 0.225598723
xp_coef = 1.0
scout_coef = 0.004167757
death_penalty = -0.290685952

# flags
# 1 removes the verb from the action space
mask_search20 = 0
mask_run = 0
# 1 = random role/race/gender/align per reset (challenge protocol)
multi_role = 1

[policy]
hidden_size = 1024
num_layers = 3

[train]
total_timesteps = 1_000_000_000
minibatch_size = 4096
horizon = 512
learning_rate = 0.00187625387
momentum = 0.917798519
verb_eps = 0.005
verb_eps_anneal_start = 0.4
verb_eps_anneal_end = 1.0
gamma = 0.999743938
gae_lambda = 0.646570504
replay_ratio = 1.29694569
clip_coef = 0.11832609
vf_coef = 0.100000001
vf_clip_coef = 0.264199078
max_grad_norm = 0.177944869
ent_coef = 0.00312376767

[sweep]
metric = score

[sweep.train.total_timesteps]
distribution = log_normal
min = 2e8
max = 1e9
scale = time

[sweep.env.exp_coef]
distribution = log_normal
min = 0.001
max = 0.1
scale = auto

[sweep.env.score_coef]
distribution = log_normal
min = 0.001
max = 0.1
scale = auto

[sweep.env.gold_coef]
distribution = log_normal
min = 0.001
max = 0.1
scale = auto

[sweep.env.descent_coef]
distribution = uniform
min = 0.0
max = 1.0
scale = auto

[sweep.env.xp_coef]
distribution = uniform
min = 0.0
max = 1.0
scale = auto

[sweep.env.scout_coef]
distribution = log_normal
min = 0.0001
max = 0.1
scale = auto

[sweep.env.death_penalty]
distribution = uniform
min = -1.0
max = 0.0
scale = auto

[sweep.train.verb_eps]
distribution = log_normal
min = 0.0005
max = 0.02
scale = auto

[sweep.train.verb_eps_anneal_start]
distribution = uniform
min = 0.2
max = 0.8
scale = auto

[sweep.env.floor_coef]
distribution = uniform
min = 0.0
max = 1.0
scale = auto
