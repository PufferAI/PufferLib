[base]
env_name = enduro

[vec]
total_agents = 256
num_buffers = 4
num_threads = 2

[env]
width = 152
height = 210
car_width = 16
car_height = 11
max_enemies = 10
continuous = 0

[policy]
hidden_size = 128
num_layers = 2

[train]
total_timesteps = 58957801
learning_rate = 0.0136314
gamma = 0.979826
gae_lambda = 0.908362
replay_ratio = 1.54521
clip_coef = 0.915672
vf_coef = 0.977532
vf_clip_coef = 1.75503
max_grad_norm = 1.08789
ent_coef = 0.00246004
momentum = 0.840696
minibatch_size = 16384
horizon = 64

[sweep]
metric = days_completed

[sweep.train.total_timesteps]
distribution = log_normal
min = 2e8
max = 6e8
mean = 4e8
scale = auto
