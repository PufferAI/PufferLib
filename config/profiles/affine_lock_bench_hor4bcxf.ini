[base]
env_name = affine_lock
seed = 73
checkpoint_interval = 1000000000
checkpoint_dir = /tmp/affine_lock_bench_checkpoints

[env]
bits = 16
start_depth = 2
max_depth = 16
depth_multiplier = 2
step_grace = 0
initialization_mode = 4
debug_log_level = 0
debug_log_env_id = 0
debug_log_max_episodes = 0
debug_log_min_depth = 16

[vec]
total_agents = 8192
num_buffers = 2
num_threads = 16

[policy]
hidden_size = 128
num_layers = 2
expansion_factor = 1

[torch]
network = MinGRU
encoder = DefaultEncoder
decoder = DefaultDecoder

[train]
total_timesteps = 200000000
horizon = 32
minibatch_size = 8192
learning_rate = 0.015
anneal_lr = 1
min_lr_ratio = 0
gamma = 0.995
gae_lambda = 0.9
replay_ratio = 1
clip_coef = 0.2
vf_coef = 2
vf_clip_coef = 0.2
max_grad_norm = 1.5
ent_coef = 0.001
beta1 = 0.95
beta2 = 0.999
eps = 1e-12
gpus = 1
seed = 42
prio_alpha = 0.8
prio_beta0 = 0.2
vtrace_rho_clip = 1
vtrace_c_clip = 1

[sweep]
metric = perf
goal = maximize
downsample = 200
