[base]
env_name = pong

[vec]
total_agents = 1024
num_buffers = 1
num_threads = 16

[env]
width = 500
height = 640
paddle_width = 20
paddle_height = 70
ball_width = 32
ball_height = 32
paddle_speed = 8
ball_initial_speed_x = 10
ball_initial_speed_y = 1
ball_speed_y_increment = 3
ball_max_speed_y = 13
max_score = 21
frameskip = 8
continuous = 0

[policy]
hidden_size = 64
num_layers = 3

[train]
gpus = 1
total_timesteps = 8000000
learning_rate = 0.1
anneal_lr = 1
min_lr_ratio = 0
gamma = 0.98529
gae_lambda = 0.995
replay_ratio = 4
clip_coef = 0.538
vf_coef = 5
vf_clip_coef = 4.38
max_grad_norm = 0.1
ent_coef = 3.85e-05
momentum = 0.5
minibatch_size = 16384
horizon = 64
vtrace_rho_clip = 4.87841
vtrace_c_clip = 1.48608

[sweep.train.total_timesteps]
distribution = log_normal
min = 5e6
max = 5e7
scale = auto

[sweep.env.frameskip]
distribution = int_uniform
min = 1
max = 8
scale = 2.0
