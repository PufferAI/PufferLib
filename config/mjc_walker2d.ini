[base]
env_name = mjc_walker2d

[vec]
total_agents = 256
num_buffers = 1
num_threads = 16

[env]
model = resources/mujoco/walker2d.bin
max_steps = 1000
reset_noise_scale = 0.005
forward_reward_weight = 1.0
ctrl_cost_weight = 0.001
healthy_reward = 1.0

[policy]
hidden_size = 256
num_layers = 2
expansion_factor = 1

[train]
gpus = 1
total_timesteps = 10000000
learning_rate = 0.004
anneal_lr = 1
min_lr_ratio = 0
gamma = 0.971
gae_lambda = 0.944
replay_ratio = 4.7
clip_coef = 0.31
vf_coef = 1.7
vf_clip_coef = 3.5
max_grad_norm = 0.77
ent_coef = 0.0035
momentum = 0.932
minibatch_size = 1024
horizon = 128
vtrace_rho_clip = 1.0
vtrace_c_clip = 1.0

[sweep]
metric = score
goal = maximize
max_runs = 30

[sweep.train.total_timesteps]
min = 1e7
max = 1.2e7

[sweep.policy.hidden_size]
min = 256
max = 512

[sweep.policy.num_layers]
distribution = int_uniform
min = 2
max = 3

[sweep.vec.total_agents]
min = 128
max = 1024

[sweep.train.horizon]
min = 32
max = 256

[sweep.train.minibatch_size]
min = 512
max = 4096

[sweep.train.replay_ratio]
min = 2
max = 6

[sweep.train.learning_rate]
min = 0.0005
max = 0.02

[sweep.train.momentum]
min = 0.5
max = 0.99

[sweep.train.ent_coef]
min = 0.00001
max = 0.01

[sweep.train.gamma]
min = 0.88
max = 0.99

[sweep.train.gae_lambda]
min = 0.8
max = 0.95

[sweep.train.clip_coef]
min = 0.1
max = 0.35

[sweep.train.vf_coef]
min = 0.5
max = 2.0

[sweep.train.vf_clip_coef]
min = 1.0
max = 5.0
