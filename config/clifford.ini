[base]
env_name = clifford

[env]
# Must match the compile-time CLIFFORD_N_QUBITS used for build.sh.
n_qubits = 6
difficulty = 10.0
max_steps = 200
single_qubit_cost = 0.001
cz_cost = 0.1
goal_bonus = 0.0
failure_penalty = -1.0
use_shortcut_gates = 1
seed = 0

[policy]
hidden_size = 128
num_layers = 2

[train]
total_timesteps = 10_000_000
