[base]
env_name = clifford

[vec]
total_agents = 4096
num_buffers = 4
num_threads = 16

[env]
# Must match the compile-time CLIFFORD_N_QUBITS / CLIFFORD_* flags.
n_qubits = 6
difficulty = 3.0
max_steps = 32
single_qubit_cost = 0.01
cz_cost = 1.0
goal_bonus = 25.0
failure_penalty = 0.0
hamming_scale = 1.0
use_shortcut_gates = 0
pair_onehot = 0
# 0 disables auto-curriculum; sequential trains bump difficulty.
# Window is per-env episode count (256 ~ 20M global steps at 4k agents).
curriculum_threshold = 0.0
curriculum_step = 1.0
curriculum_window = 256
curriculum_max = 64
seed = 0

[policy]
hidden_size = 256
num_layers = 3

[train]
total_timesteps = 100_000_000
ent_coef = 0.01
gamma = 0.99

[build]
# Compile-time layout flags; CLIFFORD_N_QUBITS is only passed when set.
cflags = -DCLIFFORD_USE_SHORTCUT_GATES=${CLIFFORD_USE_SHORTCUT_GATES:-0} -DCLIFFORD_PAIR_ONEHOT=${CLIFFORD_PAIR_ONEHOT:-0} ${CLIFFORD_N_QUBITS:+-DCLIFFORD_N_QUBITS=$CLIFFORD_N_QUBITS}
