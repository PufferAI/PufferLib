[base]
env_name = slimevolley
# Same class of 5.0 trainer change that blocked drone: stale actor + RNN carry.

[vec]
total_agents = 2048
num_buffers = 4
num_threads = 2
num_policies = 2
hist_policy_percent = 0.171324745
hist_policy_hidden_size = 512
hist_policy_num_layers = 4

# Selfplay: slot 0 is the primary policy, slot 1 is a frozen checkpoint on
# hist_policy_percent of the envs. Final score is mean env/perf vs eval_bots.
[selfplay]
enabled = 1
max_size = 100
seed = 42
opp_timeout_steps = 165567856
eval_pool_size = 8
eval_games = 4096
# Set > 0 to score off the bot ladder instead of the pool eval.
eval_bot_games = 8192
eval_bots = 0

# 1v1: num_agents + num_bots must be 2. Selfplay instead of the bot with
# ./puffer train --env.num_agents=2 --env.num_bots=0 --selfplay.enabled=1
#     --vec.num_policies=2
[env]
num_agents = 2
num_bots = 0
bot_policy = 0
max_ticks = 3000

[policy]
hidden_size = 512
num_layers = 4.63476706

[train]
total_timesteps = 151858608
learning_rate = 0.00140897371
gamma = 0.986717224
gae_lambda = 0.845131516
replay_ratio = 3.59742641
clip_coef = 0.116425134
vf_coef = 5
vf_clip_coef = 2.56304932
max_grad_norm = 0.100000001
ent_coef = 9.99999975e-06
momentum = 0.932234406
minibatch_size = 4096
horizon = 32

[sweep]
# perf/score are policy-0 win rate (0-1). Selfplay pool / bot ladder evals below.
metric = perf
downsample = 5

[sweep.train.total_timesteps]
distribution = log_normal
min = 1e8
max = 2e9
mean = 3e8
scale = time

[sweep.vec.hist_policy_percent]
distribution = uniform
min = 0.01
max = 0.5
mean = 0.15
scale = auto

[sweep.selfplay.opp_timeout_steps]
distribution = log_normal
min = 1e7
max = 1e9
mean = 1e8
scale = auto
