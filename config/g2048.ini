[base]
env_name = g2048
# Cleanba-style async learner/actor (lag 1).
async = 1

[vec]
total_agents = 4096
num_buffers = 4
num_threads = 16

[env]
scaffolding_ratio = 0.384402096

[policy]
hidden_size = 1024
num_layers = 5.53472567

[train]
gpus = 1
# Fast ~4k-band protein baseline (~340M); sweep can extend via default total_timesteps.
total_timesteps = 339676096
learning_rate = 0.00207810267
anneal_lr = 1
min_lr_ratio = 0
gamma = 0.995630145
gae_lambda = 0.859235168
replay_ratio = 1.48078966
clip_coef = 0.100000001
vf_coef = 0.819969773
vf_clip_coef = 0.00999999978
max_grad_norm = 0.804692566
ent_coef = 0.0230212156
momentum = 0.984254837
minibatch_size = 65536
horizon = 64

[sweep]
metric = score
goal = maximize
max_suggestion_cost = 7200
downsample = 5

[sweep.env.scaffolding_ratio]
distribution = uniform
min = 0.1
mean = 0.5
max = 0.8
scale = auto
