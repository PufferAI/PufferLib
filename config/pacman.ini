[base]
env_name = pacman

[vec]
total_agents = 8192
num_buffers = 4
num_threads = 2

[env]
randomize_starting_position = 1
min_start_timeout = 0
max_start_timeout = 49
frightened_time = 35
max_mode_changes = 6
scatter_mode_length = 70
chase_mode_length = 140

[policy]
hidden_size = 256
num_layers = 6

[train]
gpus = 1
total_timesteps = 204996994
learning_rate = 0.00972151
anneal_lr = 1
min_lr_ratio = 0
gamma = 0.996185
gae_lambda = 0.970583
replay_ratio = 1.78296
clip_coef = 0.126507
vf_coef = 0.1
vf_clip_coef = 3.6265
max_grad_norm = 0.604348
ent_coef = 0.2
momentum = 0.894473
minibatch_size = 16384
horizon = 64
vtrace_rho_clip = 2.07372
vtrace_c_clip = 0.465232

[sweep]
downsample = 10

[sweep.train.total_timesteps]
distribution = log_normal
min = 5e7
max = 5e8
mean = 1e8
scale = auto

