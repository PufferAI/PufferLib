[base]
env_name = mjc_humanoid

[vec]
total_agents = 2048
# GPU env builds (--cu) require 1 buffer; the CPU vec is ~1.5x faster with 4
num_buffers = 1
num_threads = 16

[env]
model = resources/mujoco/humanoid.bin
# Gymnasium Humanoid-v5 defaults (contact cost clamped at 10 in the env)
max_steps = 1000
reset_noise_scale = 0.01
forward_reward_weight = 1.25
ctrl_cost_weight = 0.1
contact_cost_weight = 0.0000005
healthy_reward = 5.0

[policy]
hidden_size = 256
num_layers = 2
expansion_factor = 1

[train]
gpus = 1
seed = 42
total_timesteps = 100000000
learning_rate = 0.005
anneal_lr = 1
min_lr_ratio = 0
gamma = 0.99
gae_lambda = 0.95
replay_ratio = 2
clip_coef = 0.2
vf_coef = 0.5
vf_clip_coef = 1.0
max_grad_norm = 0.5
ent_coef = 0.0
momentum = 0.9
minibatch_size = 8192
horizon = 64
vtrace_rho_clip = 1.0
vtrace_c_clip = 1.0

[sweep]
metric = score
goal = maximize
