[base]
env_name = racing_multi
# Cache PPO minibatches; environment ray queries remain outside capture.
cudagraphs = 1
async = 0
seed = 42
checkpoint_interval = 10
eval_episodes = 0

[vec]
# Fastest measured batch: 4096 cars / 8 = 512 independent races.
total_agents = 4096
num_buffers = 1
num_threads = 1
num_policies = 1
hist_policy_percent = 0

[env]
num_agents = 8
race_cars = 8
race_seconds = 600
wall_crash_speed = 8
lap_record_seconds = 250

[policy]
hidden_size = 256
num_layers = 3

[train]
total_timesteps = 1_000_000_000
# Conservative updates for long continuous-control runs.
learning_rate = 0.0001
anneal_lr = 1
# A 250 s lap is ~7500 policy steps; retain long-term value through bootstrapping.
gamma = 0.9999
# Extend direct credit across manoeuvres; checkpoint rewards bridge longer travel.
gae_lambda = 0.99
horizon = 256
minibatch_size = 8192
replay_ratio = 1.5
clip_coef = 0.1
# Reduce exploration pressure as the policy learns to brake for corners.
ent_coef = 0.001
anneal_ent_coef = 1
min_ent_coef_ratio = 0.2
vf_coef = 0.5
max_grad_norm = 0.5

[selfplay]
enabled = 0
max_size = 16
opp_timeout_steps = 10_000_000
# Compare a frozen challenger in slot 2 with pinned incumbent slot 1 after
# enough completed races across all starting grid positions.
promotion_min_races = 256
promotion_min_per_grid = 16
promotion_win_rate = 0.55
eval_pool_size = 0
eval_games = 0
