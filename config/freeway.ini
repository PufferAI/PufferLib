[base]
env_name = freeway

[vec]
total_agents = 16384
num_buffers = 4
num_threads = 8

[env]
frameskip = 4
width = 1216
height = 720
player_width = 64
player_height = 64
car_width = 64
car_height = 40
lane_size = 64
difficulty = 0
level = -1
enable_human_player = 0
env_randomization = 1
use_dense_rewards = 1

[policy]
hidden_size = 128
num_layers = 4

[train]
gpus = 1
total_timesteps = 1200000000
learning_rate = 0.008
anneal_lr = 1
min_lr_ratio = 0
gamma = 0.995
gae_lambda = 0.90
replay_ratio = 1.0
clip_coef = 0.2
vf_coef = 2.0
vf_clip_coef = 0.2
max_grad_norm = 1.5
ent_coef = 0.003
momentum = 0.95
minibatch_size = 16384
horizon = 64
vtrace_rho_clip = 1.0
vtrace_c_clip = 1.0

[sweep.train.total_timesteps]
distribution = log_normal
min = 3e8
max = 6e8
mean = 4e8
scale = auto
