[base]
env_name = wef
async = 1

[vec]
total_agents = 512
num_buffers = 4
num_threads = 16

[policy]
# Web/eval net. Sweep 0442 is 1024x4; do not load those weights here (prefix=garbage).
num_layers = 3
hidden_size = 256

[train]
# Best-run hypers (sweep_1786536792435_0442); arch is wef_fix 256x3, not 1024x4.
total_timesteps = 75_000_000
learning_rate = 0.00131931633
anneal_lr = 1
min_lr_ratio = 0.0
gamma = 0.921462655
gae_lambda = 0.94766283
replay_ratio = 2.08402061
clip_coef = 0.149713993
vf_coef = 4
vf_clip_coef = 0.729829371
max_grad_norm = 1.29817581
ent_coef = 0.000570211909
anneal_ent_coef = 0
min_ent_coef_ratio = 0.1
momentum = 0.914779544
minibatch_size = 4096
horizon = 32
vtrace_rho_clip = 1.0
vtrace_c_clip = 1.0

[env]
num_agents = 4
# Set min=max for evaluation; use 40 and 300 for paper-style training.
min_arena_width = 30
max_arena_width = 400
min_arena_height = 30
max_arena_height = 400
# 0=uniform, 1=patchy, 2=random
food_distribution = 2
num_food = 64
# Patchy distribution parameters.
patch_radius = 6
patch_radius_std = 1.5
patch_density = 0.001
electric_field_radius = 15
# Wall image charges for mormyromast/ampullary near boundaries (cm).
# Sensor ranges (paper): morm food 5 / agent 10; amp food 4 / agent 8; knollen 100.
reflection_wall_range = 100
episode_length = 512
