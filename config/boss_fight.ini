[base]
env_name = boss_fight

[vec]
total_agents = 1024
num_buffers = 4
num_threads = 16

[env]

[policy]
hidden_size = 64
num_layers = 2

[train]
gpus = 1
total_timesteps = 5000000
learning_rate = 0.000864
anneal_lr = 1
min_lr_ratio = 0.437
gamma = 0.983
gae_lambda = 0.902
replay_ratio = 1.0
clip_coef = 0.421
vf_coef = 4.38
vf_clip_coef = 0.303
max_grad_norm = 2.28
ent_coef = 0.00623
momentum = 0.95
minibatch_size = 2048
horizon = 32
vtrace_rho_clip = 2.72
vtrace_c_clip = 2.13

[sweep]
metric = score
goal = maximize

[sweep.train.learning_rate]
distribution = log_normal
min = 0.0001
max = 0.003

[sweep.train.ent_coef]
distribution = log_normal
min = 0.0001
max = 0.05

[sweep.train.gamma]
distribution = logit_normal
min = 0.95
max = 0.999

[sweep.train.gae_lambda]
distribution = logit_normal
min = 0.9
max = 0.99

[sweep.train.minibatch_size]
distribution = uniform_pow2
min = 1024
max = 8192
