[base]
env_name = snake

[env]
width = 640
height = 360
num_agents = 256
num_food = 4096
vision = 5
leave_corpse_on_death = True
reward_food = 0.1
reward_corpse = 0.1
reward_death = -1.0
max_snake_length = 1024
cell_size = 2

[vec]
total_agents = 8192
num_buffers = 2
num_threads = 16

[policy]
hidden_size = 1024
num_layers = 3

[train]
gpus = 1
total_timesteps = 499908996
learning_rate = 0.00798577
anneal_lr = 1
min_lr_ratio = 0
gamma = 0.850782
gae_lambda = 0.955739
replay_ratio = 1.87876
clip_coef = 0.314296
vf_coef = 4.30253
vf_clip_coef = 0.108051
max_grad_norm = 0.1
ent_coef = 0.0124108
momentum = 0.82255
minibatch_size = 65536
horizon = 16

[sweep]
max_cost = 500

[sweep.env.reward_food]
distribution = uniform
min = 0.0
max = 1.0
mean = 0.0
scale = auto

[sweep.env.reward_death]
distribution = uniform
min = -1.0
max = 0.0
mean = 0.0
scale = auto

[sweep.train.total_timesteps]
distribution = log_normal
min = 2e7
max = 5e8
mean = 1e8
scale = auto

[sweep.policy.hidden_size]
distribution = uniform_pow2
min = 16
max = 1024
mean = 128
scale = auto

[sweep.env.num_envs]
distribution = uniform_pow2
min = 1
max = 32
mean = 8
scale = auto
