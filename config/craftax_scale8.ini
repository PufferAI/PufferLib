# 8-GPU scale of craftax_1024.ini (0935 LR, 2048 agents/rank, skip-obs + rand_r).
# total_timesteps is GLOBAL under NCCL DP (local_timesteps = total / world_size).
# scale8 (4096 agents, 30B, lr 0.0047) collapsed 0.37 -> 0.31; do not retry that.
# scale8b: 2048 agents, 20B, 8x5090, ~3.8M SPS, peak ~0.62 / 140 (live).
# scale8c+: 120B then 200B chained overnight from /workspace/craftax_exp/overnight_chain.py
#   on vast (ssh -p 24450 root@154.9.228.248), binary wt_head_skip/bin_head_skip.
# Checkpoints: filename is local steps; global ≈ local * 8.

[base]
env_name = craftax
seed = 73
checkpoint_interval = 200
eval_episodes = 10000
gpu_offset = 0

[vec]
total_agents = 2048
num_buffers = 4
num_threads = 8

[env]
reset_pool_size = 8192
action_mask = 1

[policy]
hidden_size = 1024
num_layers = 4

[train]
gpus = 8
total_timesteps = 1.2e11
learning_rate = 0.00472887093
gamma = 0.999414682
gae_lambda = 0.801190972
replay_ratio = 1.17263889
clip_coef = 0.226401091
vf_coef = 0.78808409
vf_clip_coef = 1.14975154
max_grad_norm = 0.818616688
ent_coef = 0.000213571053
momentum = 0.930526733
minibatch_size = 32768
horizon = 256
