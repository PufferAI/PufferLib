[base]
env_name = go

[vec]
total_agents = 256
num_buffers = 4
num_threads = 2

[env]
width = 950
height = 750
grid_size = 9
board_width = 600
board_height = 600
grid_square_size = 64
komi = 7.5
reward_move_pass = -0.518441
reward_move_valid = 0
reward_move_invalid = -0.0864746
reward_opponent_capture = -0.102283
reward_player_capture = 0.553628
selfplay = 0

[policy]
hidden_size = 512
num_layers = 2

[train]
gpus = 1
total_timesteps = 250000000
learning_rate = 0.001
anneal_lr = 1
min_lr_ratio = 0
gamma = 0.97
gae_lambda = 0.98
replay_ratio = 3.75
clip_coef = 0.47
vf_coef = 3.6
vf_clip_coef = 2.38262
max_grad_norm = 0.1
ent_coef = 0.0004
momentum = 0.995
minibatch_size = 16384
horizon = 128
vtrace_rho_clip = 2.18666
vtrace_c_clip = 0.638156
prio_alpha = 0
prio_beta0 = 0.809042

[sweep.train.total_timesteps]
distribution = log_normal
min = 1e8
max = 1e9
mean = 3e8
scale = auto

[sweep.env.reward_move_invalid]
distribution = uniform
min = -1.0
max = 0.0
mean = -0.5
scale = 0.5

[sweep.env.reward_move_pass]
distribution = uniform
min = -1.0
max = 0.0
mean = -0.5
scale = 0.5

[sweep.env.reward_player_capture]
distribution = uniform
min = 0.0
max = 1.0
mean = 0.5
scale = 0.5

[sweep.env.reward_opponent_capture]
distribution = uniform
min = -1.0
max = 0.0
mean = -0.5
scale = 0.5
