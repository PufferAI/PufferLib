[base]
env_name = moba

[vec]
# 5 agents/env. Need total_agents % 5 == 0 and total_agents % (mb/horizon) == 0.
# 2040 % (8192/64) != 0 aborted launch. 2560 = 5*512 = 128*20.
total_agents = 2560
num_buffers = 4
num_threads = 16

[env]
vision_range = 5
agent_speed = 1
script_opponents = 1
reward_death = -0.163764
reward_xp = 0.00665677
reward_distance = 0
reward_tower = 0.642119

[policy]
hidden_size = 64
num_layers = 5

[train]
gpus = 1
total_timesteps = 39056098
learning_rate = 0.00343957
anneal_lr = 1
min_lr_ratio = 0
gamma = 0.991949
gae_lambda = 0.945677
replay_ratio = 0.832202
clip_coef = 0.565744
vf_coef = 3.37665
vf_clip_coef = 1.27302
max_grad_norm = 1.08622
ent_coef = 0.00109913
momentum = 0.837952
minibatch_size = 8192
horizon = 64
vtrace_rho_clip = 1.76073
vtrace_c_clip = 1.32578
prio_alpha = 1
prio_beta0 = 0.5692

[sweep]
downsample = 10

[sweep.env.reward_death]
distribution = uniform
min = -1.0
max = 0
mean = 0
scale = auto

[sweep.env.reward_xp]
distribution = uniform
min = 0.0
max = 0.05
mean = 0.0015
scale = auto

[sweep.env.reward_tower]
distribution = uniform
min = 0.0
max = 1.0
mean = 1.0
scale = auto
