# Web ~1M policy. rand_r + skip-offscreen mob obs (headskip256).
# Train: perf 0.389 / score 88.0 at 1.997e9 steps (1 GPU).
# LCG control on this recipe was 0.401. JAX wrap-obs retrains to ~0.27.
# Weights: craftax_1m.bin (also puffer.ai/docs/assets/models/craftax_weights.bin).
# Env: skip wrap in write_mob_obs; is_solid_block as a switch (nvcc).
# 3*H*H*L = 983040.

[base]
env_name = craftax
seed = 73
checkpoint_interval = 200
eval_episodes = 10000

[vec]
total_agents = 4096
num_buffers = 4
num_threads = 8

[env]
reset_pool_size = 8192
action_mask = 1

[policy]
hidden_size = 256
num_layers = 5

[train]
total_timesteps = 1.99737613e+09
learning_rate = 0.00369123812
gamma = 0.998953164
gae_lambda = 0.870231152
replay_ratio = 1.75109136
clip_coef = 0.308090687
vf_coef = 0.69549799
vf_clip_coef = 1.71357608
max_grad_norm = 0.638066411
ent_coef = 0.000754406501
momentum = 0.938225687
minibatch_size = 32768
horizon = 128
