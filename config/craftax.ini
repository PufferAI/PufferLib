# 1024x4 skip-obs + rand_r (0935 LR). Default is the 8-GPU scale.
# total_timesteps is GLOBAL under NCCL DP (local ≈ total / world_size).
# 1 GPU: set train.gpus=1 and train.total_timesteps=3.493e9 (same hparams).
# Do not use 4096 agents/rank with this LR — that 8-GPU run collapsed.

[base]
env_name = craftax
seed = 73
checkpoint_interval = 200
eval_episodes = 10000
gpu_offset = 0

[vec]
total_agents = 2048
num_buffers = 4
num_threads = 8

[env]
reset_pool_size = 8192
action_mask = 1

[policy]
hidden_size = 1024
num_layers = 4

[train]
gpus = 8
total_timesteps = 1.2e11
learning_rate = 0.00472887093
gamma = 0.999414682
gae_lambda = 0.801190972
replay_ratio = 1.17263889
clip_coef = 0.226401091
vf_coef = 0.78808409
vf_clip_coef = 1.14975154
max_grad_norm = 0.818616688
ent_coef = 0.000213571053
momentum = 0.930526733
minibatch_size = 32768
horizon = 256
