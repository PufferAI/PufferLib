[base]
env_name = craftax

[vec]
total_agents = 4096
num_buffers = 4
num_threads = 16

[env]
seed_offset = 0
# Pre-generated world pool. Each reset memcpys from a pool entry
# instead of re-running generate_world (~ms -> ~us per reset).
# Bounds world diversity: at most reset_pool_size unique maps are
# ever seen per process. Set to 0 to disable (required for the
# parity harness to maintain exact per-seed determinism).
reset_pool_size = 32

[train]
total_timesteps = 1_000_000_000
learning_rate = 0.011222594
ent_coef = 0.005
gamma = 0.98190003
gae_lambda = 0.9217566
horizon = 128
minibatch_size = 32768
replay_ratio = 1.7488248
clip_coef = 0.41524854
vf_coef = 2.7007978
vf_clip_coef = 0.01
max_grad_norm = 3.0366656
beta1 = 0.93491626
beta2 = 0.99692244
eps = 1.2829034e-08
vtrace_rho_clip = 0.79657767
vtrace_c_clip = 1.0472921
prio_alpha = 0.46023299
prio_beta0 = 0.21990312

[policy]
hidden_size = 128
num_layers = 3
expansion_factor = 1

[sweep]
downsample = 5

[sweep.train.total_timesteps]
distribution = log_normal
min = 1e8
max = 1e9
mean = 5e8
scale = time

[sweep.train.ent_coef]
distribution = log_normal
min = 0.0001
max = 0.005
scale = auto

[sweep.train.learning_rate]
distribution = log_normal
min = 0.0015
max = 0.015
scale = 0.5

[sweep.policy.num_layers]
distribution = uniform
min = 3
max = 8
scale = auto

[sweep.train.horizon]
distribution = uniform_pow2
min = 128
max = 512
scale = auto

[sweep.policy.hidden_size]
distribution = uniform_pow2
min = 128
max = 512
scale = auto

[sweep.vec.num_buffers]
distribution = uniform
min = 1
max = 4
scale = auto
