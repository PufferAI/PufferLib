[base]
env_name = pathfinder

[vec]
total_agents = 8192
num_buffers = 2
num_threads = 0

[env]
branch_prob = 0.35
loop_prob = 0.10
extra_entry_prob = 0.0
min_solution_len = 1
max_solution_len = 4
max_steps = 128

[policy]
hidden_size = 512
num_layers = 2
expansion_factor = 1

[train]
gpus = 1
seed = 42
total_timesteps = 100000000
learning_rate = 0.001
anneal_lr = 1
min_lr_ratio = 0
gamma = 0.995
gae_lambda = 0.95
replay_ratio = 1
clip_coef = 0.1
vf_coef = 0.5
vf_clip_coef = 5
max_grad_norm = 1.0
ent_coef = 0.005
anneal_ent_coef = 0
min_ent_coef_ratio = 0.1
beta1 = 0.9
beta2 = 0.999
eps = 1e-8
minibatch_size = 32768
horizon = 128
vtrace_rho_clip = 1
vtrace_c_clip = 1
prio_alpha = 0
prio_beta0 = 0
anneal_prio_beta = 0
state_buffer_size = 0
cl_frac = 0
anneal_cl = 0
warmup_states = 100
state_checkpoint_interval = 16
explore_alpha = 1
explore_beta = 0
explore_decay = 0.99
use_rnn = 1
env = 0

[sweep]
max_suggestion_cost = 7200

[sweep.env.branch_prob]
distribution = uniform
min = 0.05
mean = 0.35
max = 0.75
scale = auto

[sweep.env.loop_prob]
distribution = uniform
min = 0.0
mean = 0.1
max = 0.5
scale = auto

[sweep.train.learning_rate]
distribution = log_normal
min = 0.0001
mean = 0.001
max = 0.005
scale = auto
