max_runs = 80
downsample = 5

[sweep.env.branch_prob]
distribution = uniform
min = 0.0
mean = 0.08
max = 0.22
scale = auto

[sweep.env.loop_prob]
distribution = uniform
min = 0.0
mean = 0.02
max = 0.12
scale = auto

[sweep.train.learning_rate]
distribution = log_normal
min = 0.0001
mean = 0.001
max = 0.005
scale = auto

[sweep.train.total_timesteps]
distribution = log_normal
min = 1e7
mean = 1.5e7
max = 2.5e7
scale = time

[sweep.policy.hidden_size]
distribution = uniform_pow2
min = 32
mean = 64
max = 128
scale = auto

[sweep.policy.num_layers]
distribution = uniform
min = 1
mean = 1
max = 2
scale = auto

[sweep.vec.total_agents]
distribution = uniform_pow2
min = 1024
mean = 1024
max = 8192
scale = auto

[sweep.train.horizon]
distribution = uniform_pow2
min = 16
mean = 32
max = 64
scale = auto

[sweep.train.minibatch_size]
distribution = uniform_pow2
min = 8192
mean = 16384
max = 16384
scale = auto
