[base]
env_name = pathfinder

[vec]
total_agents = 8192
num_buffers = 2
num_threads = 0

[env]
branch_prob = 0.11
loop_prob = 0.04
extra_entry_prob = 0.0
min_solution_len = 1
max_solution_len = 4
max_steps = 128

[policy]
hidden_size = 128
num_layers = 2
expansion_factor = 1

[train]
gpus = 1
seed = 42
total_timesteps = 20_000_000
learning_rate = 0.004385555933422184
anneal_lr = 1
min_lr_ratio = 0
gamma = 0.9156890319524347
gae_lambda = 0.995
replay_ratio = 1.841268465367614
clip_coef = 0.5499249092401194
vf_coef = 3.2377097432640958
vf_clip_coef = 1.8780705428234663
max_grad_norm = 1.6383931004852927
ent_coef = 0.006542649506789298
anneal_ent_coef = 0
min_ent_coef_ratio = 0.1
beta1 = 0.9
beta2 = 0.999
eps = 1e-8
minibatch_size = 8192
horizon = 256
vtrace_rho_clip = 5
vtrace_c_clip = 2.3816034577895158
prio_alpha = 1
prio_beta0 = 0.3976524344305938
anneal_prio_beta = 0
state_buffer_size = 0
cl_frac = 0
anneal_cl = 0
warmup_states = 100
state_checkpoint_interval = 16
explore_alpha = 1
explore_beta = 0
explore_decay = 0.99
use_rnn = 1
env = 0
eval_episodes = 2000

[sweep]
max_suggestion_cost = 7200
max_runs = 80
downsample = 5

[sweep.env.branch_prob]
distribution = uniform
min = 0.0
mean = 0.08
max = 0.22
scale = auto

[sweep.env.loop_prob]
distribution = uniform
min = 0.0
mean = 0.02
max = 0.12
scale = auto

[sweep.train.learning_rate]
distribution = log_normal
min = 0.0001
mean = 0.001
max = 0.005
scale = auto

[sweep.train.total_timesteps]
distribution = log_normal
min = 1e7
mean = 1.5e7
max = 2.5e7
scale = time

[sweep.policy.hidden_size]
distribution = uniform_pow2
min = 64
mean = 256
max = 512
scale = auto

[sweep.policy.num_layers]
distribution = uniform
min = 1
mean = 2
max = 4
scale = auto

[sweep.vec.total_agents]
distribution = uniform_pow2
min = 256
mean = 1024
max = 2048
scale = auto

[sweep.train.horizon]
distribution = uniform_pow2
min = 16
mean = 64
max = 128
scale = auto

[sweep.train.minibatch_size]
distribution = uniform_pow2
min = 1024
mean = 2048
max = 8192
scale = auto
